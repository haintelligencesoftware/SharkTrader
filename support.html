const DATA={"en": {"title": "Shark Trader — Support", "items": [["body", "Need help? Email kocyigit.vdt@gmail.com and we will reply as soon as we can. Please include your username and, if possible, a screenshot."], ["heading", "Getting started"], ["body", "Create a bot in the app, choose Demo to try without real money, and write your rules in the script editor. The in-app Guide explains every command with examples."], ["heading", "How do I connect Binance?"], ["body", "Create an API key on Binance (for real trading) or in Binance Demo Trading (for demo), enable Spot and/or Futures trading, and keep WITHDRAWAL permission disabled. Add the key in the app's exchange connection screen. The app rejects keys that have withdrawal enabled."], ["heading", "What is the difference between Demo and Live?"], ["body", "Demo uses Binance Demo Trading and no real money. Live places real orders on your exchange account and requires a subscription."], ["heading", "Two-factor authentication (TradingView)"], ["body", "If you send signals from TradingView, two-factor authentication must be enabled on your TradingView account, otherwise webhook alerts are not sent."], ["heading", "Subscriptions"], ["body", "Subscriptions are billed and managed by Apple. To cancel or change a plan, open Settings > your name > Subscriptions on your iPhone. You can restore purchases from the subscription screen in the app. Refunds are handled by Apple (reportaproblem.apple.com)."], ["heading", "Delete my account"], ["body", "Profile > Delete Account removes your account, exchange connections and personal data. Stop running bots first. Records that must be kept by law are excluded."], ["heading", "Forgot my password"], ["body", "Use \"Forgot password\" on the sign-in screen. If the email does not arrive, check your spam folder or write to us."], ["heading", "Risk notice"], ["body", "Trading crypto involves a high risk of loss. Shark Trader executes the rules you write and does not give investment advice. Live results can differ from demo and backtests (fill prices, slippage, exchange behavior); start with small amounts."], ["heading", "Legal"], ["body", "Terms of Use: terms.html · Privacy Policy: privacy.html"]]}, "tr": {"title": "Shark Trader — Destek", "items": [["body", "Yardıma mı ihtiyacın var? kocyigit.vdt@gmail.com adresine yaz, en kısa sürede dönelim. Lütfen kullanıcı adını ve mümkünse bir ekran görüntüsünü ekle."], ["heading", "Başlarken"], ["body", "Uygulamada bir bot oluştur, gerçek para kullanmadan denemek için Demo'yu seç ve kurallarını script editöründe yaz. Uygulamadaki Kılavuz her komutu örneklerle anlatır."], ["heading", "Binance'i nasıl bağlarım?"], ["body", "Binance'te (gerçek işlem için) ya da Binance Demo Trading'de (demo için) bir API anahtarı oluştur, Spot ve/veya Futures işlem iznini aç ve PARA ÇEKME yetkisini KAPALI tut. Anahtarı uygulamadaki borsa bağlantı ekranından ekle. Para çekme yetkisi açık anahtarlar uygulama tarafından reddedilir."], ["heading", "Demo ile Canlı arasındaki fark nedir?"], ["body", "Demo, Binance Demo Trading'i kullanır ve gerçek para yoktur. Canlı, borsa hesabında gerçek emirler verir ve abonelik gerektirir."], ["heading", "İki adımlı doğrulama (TradingView)"], ["body", "TradingView'den sinyal göndereceksen TradingView hesabında iki adımlı doğrulama açık olmalıdır; aksi halde webhook bildirimleri gönderilmez."], ["heading", "Abonelikler"], ["body", "Abonelikler Apple tarafından faturalandırılır ve yönetilir. Planı iptal etmek ya da değiştirmek için iPhone'da Ayarlar > adın > Abonelikler bölümüne git. Satın almaları uygulamadaki abonelik ekranından geri yükleyebilirsin. İadeleri Apple yürütür (reportaproblem.apple.com)."], ["heading", "Hesabımı silmek istiyorum"], ["body", "Profil > Hesabı Sil, hesabını, borsa bağlantılarını ve kişisel verilerini siler. Önce çalışan botları durdur. Yasal olarak saklanması gereken kayıtlar hariçtir."], ["heading", "Şifremi unuttum"], ["body", "Giriş ekranındaki \"Şifremi unuttum\" seçeneği const sel=document.getElementById("lang");
function pick(){const q=new URLSearchParams(location.search).get("lang");if(q&&DATA[q])return q;
 const n=(navigator.language||"en");if(DATA[n])return n;const s=n.split("-")[0];return DATA[s]?s:"en";}
function render(l){const d=DATA[l];document.documentElement.lang=l;document.documentElement.dir=l==="ur"?"rtl":"ltr";

const DATA={"en": {"title": "Terms of Use", "items": [["body", "Last updated: 2026"], ["body", "Service provider: Vedat Koçyiğit (individual developer). Contact: kocyigit.vdt@gmail.com"], ["heading", "1. Description of the Service"], ["body", "Shark Trader (the \"App\") is a software service that lets users connect to their own exchange accounts (via API key) and create automated trading bots. The App runs in two modes: Demo (virtual/sandbox, no real money moves) and Live (places real orders with real money). The App is NOT a broker, portfolio management company, crypto-asset service provider or investment adviser. It does not hold users' funds; it only relays orders in the user's own exchange account according to the rules the user sets. Regulation of crypto assets varies by country and may change; you are responsible for ensuring that your use of the App complies with the laws where you are."], ["heading", "2. Investment Risk Warning"], ["body", "Trading crypto assets and other financial instruments carries high risk; you may lose the entire amount you invest. The bots, indicators, backtest results and sample strategies in the App are NOT INVESTMENT ADVICE. Past performance (including backtests) does not guarantee future results. Every bot you create in Live mode is your own decision and your own responsibility."], ["heading", "2.1. Your Own Strategies"], ["body", "You write or choose Indicator Bot scripts and other bot settings yourself. A strategy you write may be faulty, incomplete or harmful; the App accepting (validating) your script does not mean the strategy will be profitable or safe. You are fully responsible for your strategies and for any losses arising from them. Copying someone else's strategy from the Marketplace is likewise your own decision and responsibility."], ["heading", "2.2. Risks of Automated Trading"], ["body", "Automated trading comes with the following risks, and the App provider is not liable for losses arising from them: bots not running, or stop-loss/take-profit orders not executing on time, during server, network or exchange outages; delayed, wrong or missing price data; slippage and partial fills; limit orders that never fill; exchange rate limits and orders rejected by the exchange; the exchange changing its API. Backtest results rely on historical data and may not reflect fees, slippage and liquidity as they occur in reality. Stopping a bot in Live mode does not close open positions on the exchange; monitoring your positions is your responsibility."], ["heading", "3. Account and API Keys"], ["body", "Your exchange API keys are stored encrypted and are used only to place orders on your behalf. You are responsible for keeping WITHDRAWAL permission DISABLED on your keys; the App does not disable it, it only detects when it is enabled and warns or rejects. You are responsible for the security of your account and API keys."], ["heading", "4. Subscription and Payment"], ["body", "Some features (creating live bots, more than one demo bot, more than 5 backtests per month) require a paid subscription. Subscriptions are managed through the Apple App Store; pricing, cancellation and refund terms are subject to Apple's own policies."], ["heading", "5. Limitation of Liability"], ["body", "The App provider cannot be held liable for any direct or indirect financial loss arising from use of the App, including exchange outages, API errors, network delays, market volatility or user error. The App is provided \"as is\" and is not guaranteed to run uninterrupted or error-free."], ["heading", "6. Prohibited Use"], ["body", "You may not use the App for unlawful purposes, to trade on someone else's account without permission, or in a way that violates exchange or Apple rules."], ["heading", "7. Account Termination"], ["body", "If you are found to have violated these terms, your account may be suspended or closed."], ["heading", "8. Deleting Your Account"], ["body", "You can delete your account at any time under Profile > Delete Account. If you have a running bot or a strategy published on the Marketplace, you must first stop or remove it. Deleting the account does not cancel your Apple subscription; you must cancel it separately under App Store > Subscriptions."], ["heading", "9. Governing Law and Jurisdiction"], ["body", "These terms are governed by the laws of the Republic of Türkiye. Turkish courts and enforcement offices have jurisdiction over disputes; the jurisdiction rules of consumer legislation and your right to apply to consumer arbitration boards are reserved."], ["heading", "10. Changes"], ["body", "These terms may be updated from time to time; you will be notified in the app of significant changes."]]}, "tr": {"title": "Kullanım Şartları", "items": [["body", "Son güncelleme: 2026"], ["body", "Hizmet Sağlayıcı: Vedat Koçyiğit (bireysel geliştirici). İletişim: kocyigit.vdt@gmail.com"], ["heading", "1. Hizmetin Tanımı"], ["body", "Shark Trader (\"Uygulama\"), kullanıcıların kendi borsa hesaplarına (API anahtarı ile) bağlanarak otomatik alım-satım botları oluşturmasını sağlayan bir yazılım hizmetidir. Uygulama; Demo (sanal/sandbox, gerçek para hareket etmez) ve Canlı (gerçek para ile gerçek emir gönderir) olmak üzere iki modda çalışır. Uygulama; aracı kurum, portföy yönetim şirketi, kripto varlık hizmet sağlayıcısı veya yatırım danışmanı DEĞİLDİR. Kullanıcının fonlarını saklamaz; yalnızca kullanıcının kendi borsa hesabındaki emirleri, kullanıcının kurduğu kurallara göre iletir. Kripto varlıklara ilişkin mevzuat ülkeden ülkeye değişir ve değişebilir; Uygulama'yı kullanmanın bulunduğunuz yerdeki mevzuata uygunluğundan siz sorumlusunuz."], ["heading", "2. Yatırım Riski Uyarısı"], ["body", "Kripto para ve diğer finansal varlıklarla işlem yapmak yüksek risk taşır; yatırdığınız tutarın tamamını kaybedebilirsiniz. Uygulama içindeki botlar, göstergeler, backtest sonuçları ve örnek stratejiler YATIRIM TAVSİYESİ DEĞİLDİR. Geçmiş performans (backtest dahil) gelecekteki sonuçları garanti etmez. Canlı modda oluşturduğunuz her bot, kendi kararınızla ve kendi sorumluluğunuzdadır."], ["heading", "2.1. Kendi Stratejileriniz"], ["body", "Indicator Bot script'lerini ve diğer bot ayarlarını siz yazar veya seçersiniz. Yazdığınız strateji hatalı, eksik ya da zararlı olabilir; Uygulama'nın script'inizi hatasız kabul etmesi (doğrulaması) stratejinin kâr edeceği veya güvenli olduğu anlamına gelmez. Stratejilerinizin ve bunlardan doğan kayıpların tüm sorumluluğu size aittir. Marketplace'te başkasının stratejisini kopyalamak da aynı şekilde sizin kararınız ve sorumluluğunuzdadır."], ["heading", "2.2. Otomatik İşlem Riskleri"], ["body", "Otomatik işlem şu risklerle birlikte gelir ve bunlardan doğan zararlardan Uygulama sağlayıcısı sorumlu değildir: sunucu, ağ veya borsa kesintileri sırasında botların çalışmaması ya da stop-loss/kâr al emirlerinin zamanında çalışmaması; gecikmiş, hatalı veya eksik fiyat verisi; kayma (slippage) ve kısmi dolum; limit emrin hiç dolmaması; borsa hız sınırları ve borsa tarafından reddedilen emirler; borsanın API'yi değiştirmesi. Backtest sonuçları geçmiş veriye dayanır, komisyon, kayma ve likiditeyi gerçekteki gibi yansıtmayabilir. Canlı modda bir botu durdurmak borsadaki açık pozisyonları kapatmaz; pozisyonlarınızı takip etmek sizin sorumluluğunuzdadır."], ["heading", "3. Hesap ve API Anahtarları"], ["body", "Borsa API anahtarlarınız şifrelenmiş olarak saklanır ve yalnızca sizin adınıza emir vermek için kullanılır. Anahtarlarınızda PARA ÇEKME (withdrawal) yetkisinin KAPALI olmasından siz sorumlusunuz; Uygulama bu yetkiyi kapatmaz, sadece açık olduğunu tespit edip uyarır/reddeder. Hesabınızın ve API anahtarlarınızın güvenliğinden siz sorumlusunuz."], ["heading", "4. Abonelik ve Ödeme"], ["body", "Bazı özellikler (canlı bot oluşturma, birden fazla demo bot, ayda 5'ten fazla backtest) ücretli abonelik gerektirir. Abonelikler Apple App Store üzerinden yönetilir; ücretlendirme, iptal ve iade koşulları Apple'ın kendi politikalarına tabidir."], ["heading", "5. Sorumluluğun Sınırlandırılması"], ["body", "Uygulama sağlayıcısı; borsa kesintileri, API hataları, ağ gecikmeleri, piyasa oynaklığı veya kullanıcı hatası dahil olmak üzere Uygulama'nın kullanımından doğan hiçbir doğrudan veya dolaylı finansal kayıptan sorumlu tutulamaz. Uygulama \"olduğu gibi\" sunulur, kesintisiz veya hatasız çalışacağı garanti edilmez."], ["heading", "6. Yasak Kullanım"], ["body", "Uygulama'yı yasa dışı amaçlarla, başkasının hesabıyla izinsiz işlem yapmak için veya borsa/Apple kurallarını ihlal edecek şekilde kullanamazsınız."], ["heading", "7. Hesap Sonlandırma"], ["body", "Bu şartları ihlal ettiğiniz tespit edilirse hesabınız askıya alınabilir veya kapatılabilir."], ["heading", "8. Hesabın Silinmesi"], ["body", "Hesabınızı istediğiniz zaman Profil > Hesabı Sil bölümünden silebilirsiniz. Çalışan botunuz veya Marketplace'te yayınlanmış stratejiniz varsa önce onları durdurmanız/kaldırmanız gerekir. Hesabı silmek Apple aboneliğinizi iptal etmez; aboneliği App Store > Abonelikler bölümünden ayrıca iptal etmelisiniz."], ["heading", "9. Uygulanacak Hukuk ve Yetkili Mahkeme"], ["body", "Bu şartlara Türkiye Cumhuriyeti hukuku uygulanır. Uyuşmazlıklarda Türkiye mahkemeleri ve icra daireleri yetkilidir; tüketici mevzuatındaki yetki kuralları ve tüketici hakem heyetlerine başvuru hakkınız saklıdır."], ["heading", "10. Değişiklikler"], ["body", "Bu şartlar zaman zaman güncellenebilir; önemli değişikliklerde uygulama içinden bilgilendirilirsiniz."]]}, "es": {"title": "Términos de uso", "items": [["body", "Última actualización: 2026"], ["body", "Proveedor del servicio: Vedat Koçyiğit (desarrollador individual). Contacto: kocyigit.vdt@gmail.com"], ["heading", "1. Descripción del servicio"], ["body", "Shark Trader (la «App») es un servicio de software que permite a los usuarios conectarse a sus propias cuentas de exchange (mediante clave API) y crear bots de trading automático. La App funciona en dos modos: Demo (virtual/sandbox, no se mueve dinero real) y Live (envía órdenes reales con dinero real). La App NO es un bróker, una gestora de carteras, un proveedor de servicios de criptoactivos ni un asesor de inversión. No custodia los fondos de los usuarios; solo transmite órdenes en la propia cuenta de exchange del usuario según las reglas que este establece. La regulación de los criptoactivos varía según el país y puede cambiar; eres responsable de que tu uso de la App cumpla la normativa de tu lugar de residencia."], ["heading", "2. Advertencia de riesgo de inversión"], ["body", "Operar con criptoactivos y otros instrumentos financieros conlleva un riesgo elevado; puedes perder la totalidad del importe invertido. Los bots, indicadores, resultados de backtest y estrategias de ejemplo de la App NO SON ASESORAMIENTO DE INVERSIÓN. El rendimiento pasado (incluido el backtest) no garantiza resultados futuros. Cada bot que crees en modo Live es decisión y responsabilidad tuya."], ["heading", "2.1. Tus propias estrategias"], ["body", "Tú escribes o eliges los scripts del Indicator Bot y demás ajustes de los bots. Una estrategia que escribas puede ser errónea, incompleta o perjudicial; que la App acepte (valide) tu script no significa que la estrategia vaya a ser rentable o segura. Eres plenamente responsable de tus estrategias y de las pérdidas que se deriven de ellas. Copiar la estrategia de otra persona desde el Marketplace también es decisión y responsabilidad tuya."], ["heading", "2.2. Riesgos del trading automático"], ["body", "El trading automático conlleva los siguientes riesgos y el proveedor de la App no responde de las pérdidas derivadas de ellos: bots que no se ejecutan, u órdenes de stop-loss/take-profit que no se ejecutan a tiempo, durante caídas del servidor, de la red o del exchange; datos de precios retrasados, erróneos o ausentes; deslizamiento (slippage) y ejecuciones parciales; órdenes límite que nunca se ejecutan; límites de frecuencia del exchange y órdenes rechazadas por este; cambios de API del exchange. Los resultados de backtest se basan en datos históricos y pueden no reflejar comisiones, deslizamiento y liquidez tal como ocurren en la realidad. Detener un bot en modo Live no cierra las posiciones abiertas en el exchange; vigilar tus posiciones es tu responsabilidad."], ["heading", "3. Cuenta y claves API"], ["body", "Tus claves API del exchange se almacenan cifradas y solo se usan para enviar órdenes en tu nombre. Eres responsable de mantener DESACTIVADO el permiso de RETIRADA en tus claves; la App no lo desactiva, solo detecta si está activado y avisa o rechaza. Eres responsable de la seguridad de tu cuenta y de tus claves API."], ["heading", "4. Suscripción y pago"], ["body", "Algunas funciones (crear bots live, más de un bot demo, más de 5 backtests al mes) requieren una suscripción de pago. Las suscripciones se gestionan a través de la App Store de Apple; las condiciones de precio, cancelación y reembolso están sujetas a las políticas de Apple."], ["heading", "5. Limitación de responsabilidad"], ["body", "El proveedor de la App no puede ser considerado responsable de ninguna pérdida financiera directa o indirecta derivada del uso de la App, incluidas caídas del exchange, errores de API, retrasos de red, volatilidad del mercado o error del usuario. La App se ofrece «tal cual» y no se garantiza que funcione de forma ininterrumpida o sin errores."], ["heading", "6. Uso prohibido"], ["body", "No puedes usar la App con fines ilegales, para operar en la cuenta de otra persona sin permiso ni de forma que infrinja las normas del exchange o de Apple."], ["heading", "7. Cierre de la cuenta"], ["body", "Si se detecta que has incumplido estos términos, tu cuenta podrá ser suspendida o cerrada."], ["heading", "8. Eliminación de la cuenta"], ["body", "Puedes eliminar tu cuenta en cualquier momento en Perfil > Eliminar cuenta. Si tienes un bot en ejecución o una estrategia publicada en el Marketplace, primero debes detenerlo o retirarla. Eliminar la cuenta no cancela tu suscripción de Apple; debes cancelarla aparte en App Store > Suscripciones."], ["heading", "9. Ley aplicable y jurisdicción"], ["body", "Estos términos se rigen por las leyes de la República de Türkiye. Los tribunales y las oficinas de ejecución turcos son competentes en caso de disputa; quedan a salvo las reglas de competencia de la legislación de consumo y tu derecho a acudir a las juntas arbitrales de consumo."], ["heading", "10. Cambios"], ["body", "Estos términos pueden actualizarse de vez en cuando; se te informará en la app de los cambios importantes."]]}, "fil": {"title": "Mga Tuntunin sa Paggamit", "items": [["body", "Huling na-update: 2026"], ["body", "Tagapagbigay ng serbisyo: Vedat Koçyiğit (indibidwal na developer). Contact: kocyigit.vdt@gmail.com"], ["heading", "1. Paglalarawan ng Serbisyo"], ["body", "Ang Shark Trader (ang \"App\") ay isang software service na nagpapahintulot sa mga user na kumonekta sa sarili nilang exchange account (gamit ang API key) at gumawa ng mga automated trading bot. Tumatakbo ang App sa dalawang mode: Demo (virtual/sandbox, walang tunay na perang gumagalaw) at Live (nagpapadala ng tunay na order gamit ang tunay na pera). HINDI broker, portfolio management company, crypto-asset service provider o investment adviser ang App. Hindi nito hawak ang pondo ng mga user; ipinapasa lang nito ang mga order sa sariling exchange account ng user ayon sa mga patakarang itinakda ng user. Iba-iba ang regulasyon sa crypto asset sa bawat bansa at maaaring magbago; ikaw ang responsable na ang paggamit mo ng App ay sumusunod sa batas kung saan ka naroroon."], ["heading", "2. Babala sa Panganib sa Pamumuhunan"], ["body", "Mataas ang panganib ng pag-trade ng crypto asset at iba pang pinansyal na instrumento; maaari mong mawala ang buong perang inilagay mo. Ang mga bot, indicator, resulta ng backtest at halimbawang estratehiya sa App ay HINDI PAYO SA PAMUMUHUNAN. Hindi garantiya ng hinaharap na resulta ang nakaraang performance (kasama ang backtest). Ang bawat bot na ginawa mo sa Live mode ay sarili mong desisyon at responsibilidad."], ["heading", "2.1. Ang Sarili Mong mga Estratehiya"], ["body", "Ikaw mismo ang sumusulat o pumipili ng mga script ng Indicator Bot at iba pang setting ng bot. Ang estratehiyang isinulat mo ay maaaring mali, kulang o mapaminsala; hindi nangangahulugang kikita o ligtas ang estratehiya dahil tinanggap (na-validate) ng App ang script mo. Ikaw ang lubos na responsable sa mga estratehiya mo at sa mga pagkalugi mula sa mga ito. Sarili mo ring desisyon at responsibilidad ang pagkopya ng estratehiya ng iba mula sa Marketplace."], ["heading", "2.2. Mga Panganib ng Automated Trading"], ["body", "May mga sumusunod na panganib ang automated trading, at hindi mananagot ang tagapagbigay ng App sa mga pagkalugi mula rito: hindi pagtakbo ng mga bot, o hindi napapanahong pagtakbo ng stop-loss/take-profit na order, kapag may problema ang server, network o exchange; naantala, maling o kulang na datos ng presyo; slippage at bahagyang pagpuno; limit order na hindi napupunan; mga limitasyon ng exchange sa bilis ng request at mga order na tinanggihan ng exchange; pagbabago ng exchange sa API nito. Nakabatay ang resulta ng backtest sa datos ng nakaraan at maaaring hindi maipakita nang totoo ang bayarin, slippage at liquidity. Hindi isinasara ng pagtigil sa bot sa Live mode ang mga bukas na posisyon sa exchange; ikaw ang responsable sa pagsubaybay ng mga posisyon mo."], ["heading", "3. Account at mga API Key"], ["body", "Nakaimbak nang naka-encrypt ang mga API key mo sa exchange at ginagamit lang para magpadala ng order sa ngalan mo. Ikaw ang responsable na nakasara ang pahintulot sa PAG-WITHDRAW sa mga key mo; hindi ito isinasara ng App, natutukoy lang nito kung bukas at nagbababala o tumatanggi. Ikaw ang responsable sa seguridad ng account at mga API key mo."], ["heading", "4. Subscription at Bayad"], ["body", "Ang ilang feature (paggawa ng live bot, higit sa isang demo bot, higit sa 5 backtest kada buwan) ay nangangailangan ng bayad na subscription. Pinamamahalaan ang mga subscription sa Apple App Store; nasa ilalim ng sariling patakaran ng Apple ang presyo, pagkansela at refund."], ["heading", "5. Limitasyon ng Pananagutan"], ["body", "Hindi mananagot ang tagapagbigay ng App sa anumang direkta o hindi direktang pagkalugi sa pananalapi mula sa paggamit ng App, kasama ang mga aberya ng exchange, error sa API, pagkaantala ng network, pabagu-bago ng merkado o pagkakamali ng user. Ibinibigay ang App \"as is\" at hindi garantisadong tuloy-tuloy o walang error ang takbo."], ["heading", "6. Bawal na Paggamit"], ["body", "Hindi mo maaaring gamitin ang App para sa labag sa batas na layunin, para mag-trade sa account ng iba nang walang pahintulot, o sa paraang lumalabag sa patakaran ng exchange/Apple."], ["heading", "7. Pagsasara ng Account"], ["body", "Kapag napatunayang nilabag mo ang mga tuntuning ito, maaaring masuspinde o maisara ang account mo."], ["heading", "8. Pag-delete ng Account"], ["body", "Maaari mong i-delete ang account mo anumang oras sa Profile > Burahin ang Account. Kung may tumatakbo kang bot o estratehiyang nakapublish sa Marketplace, kailangan mo muna itong itigil/alisin. Hindi kinakansela ng pag-delete ng account ang Apple subscription mo; kanselahin ito nang hiwalay sa App Store > Mga Subscription."], ["heading", "9. Umiiral na Batas at Hurisdiksyon"], ["body", "Ang mga tuntuning ito ay sakop ng batas ng Republika ng Türkiye. May hurisdiksyon ang mga korte at tanggapan ng pagpapatupad ng Türkiye sa mga alitan; nananatili ang mga tuntunin ng hurisdiksyon sa batas ng consumer at ang karapatan mong lumapit sa mga consumer arbitration board."], ["heading", "10. Mga Pagbabago"], ["body", "Maaaring i-update paminsan-minsan ang mga tuntuning ito; aabisuhan ka sa app tungkol sa mahahalagang pagbabago."]]}, "hi": {"title": "उपयोग की शर्तें", "items": [["body", "अंतिम अपडेट: 2026"], ["body", "सेवा प्रदाता: Vedat Koçyiğit (व्यक्तिगत डेवलपर)। संपर्क: kocyigit.vdt@gmail.com"], ["heading", "1. सेवा का विवरण"], ["body", "Shark Trader (\"ऐप\") एक सॉफ़्टवेयर सेवा है जो उपयोगकर्ताओं को अपने एक्सचेंज खातों से (API कुंजी के ज़रिए) जुड़ने और स्वचालित ट्रेडिंग बॉट बनाने देती है। ऐप दो मोड में चलता है: Demo (आभासी/सैंडबॉक्स, असली पैसा नहीं चलता) और Live (असली पैसे से असली ऑर्डर भेजता है)। ऐप कोई ब्रोकर, पोर्टफ़ोलियो प्रबंधन कंपनी, क्रिप्टो-एसेट सेवा प्रदाता या निवेश सलाहकार नहीं है। यह उपयोगकर्ताओं के फंड अपने पास नहीं रखता; केवल उपयोगकर्ता के अपने एक्सचेंज खाते में उसके तय किए नियमों के अनुसार ऑर्डर भेजता है। क्रिप्टो-एसेट संबंधी नियम देश-देश में अलग हैं और बदल सकते हैं; ऐप का उपयोग आपके स्थान के कानूनों के अनुरूप हो, इसकी ज़िम्मेदारी आपकी है।"], ["heading", "2. निवेश जोखिम चेतावनी"], ["body", "क्रिप्टो एसेट और अन्य वित्तीय साधनों में ट्रेडिंग में उच्च जोखिम है; आप लगाई गई पूरी राशि खो सकते हैं। ऐप के बॉट, इंडिकेटर, बैकटेस्ट परिणाम और उदाहरण रणनीतियाँ निवेश सलाह नहीं हैं। पिछला प्रदर्शन (बैकटेस्ट सहित) भविष्य के नतीजों की गारंटी नहीं देता। Live मोड में आपका बनाया हर बॉट आपका अपना निर्णय और आपकी अपनी ज़िम्मेदारी है।"], ["heading", "2.1. आपकी अपनी रणनीतियाँ"], ["body", "Indicator Bot स्क्रिप्ट और अन्य बॉट सेटिंग आप स्वयं लिखते या चुनते हैं। आपकी लिखी रणनीति गलत, अधूरी या हानिकारक हो सकती है; ऐप द्वारा आपकी स्क्रिप्ट को स्वीकार (मान्य) करने का अर्थ यह नहीं कि रणनीति लाभदायक या सुरक्षित होगी। अपनी रणनीतियों और उनसे होने वाले नुकसान की पूरी ज़िम्मेदारी आपकी है। Marketplace से किसी और की रणनीति कॉपी करना भी आपका अपना निर्णय और ज़िम्मेदारी है।"], ["heading", "2.2. स्वचालित ट्रेडिंग के जोखिम"], ["body", "स्वचालित ट्रेडिंग में ये जोखिम हैं और इनसे होने वाले नुकसान के लिए ऐप प्रदाता उत्तरदायी नहीं है: सर्वर, नेटवर्क या एक्सचेंज बाधा के दौरान बॉट का न चलना या stop-loss/take-profit ऑर्डर का समय पर न चलना; देर से आया, गलत या अधूरा मूल्य डेटा; स्लिपेज और आंशिक फ़िल; लिमिट ऑर्डर का कभी न भरना; एक्सचेंज की दर सीमाएँ और एक्सचेंज द्वारा अस्वीकृत ऑर्डर; एक्सचेंज द्वारा API बदलना। बैकटेस्ट परिणाम ऐतिहासिक डेटा पर आधारित हैं और शुल्क, स्लिपेज तथा तरलता को वास्तविकता जैसा नहीं दर्शा सकते। Live मोड में बॉट रोकने से एक्सचेंज की खुली पोज़िशन बंद नहीं होतीं; अपनी पोज़िशन पर नज़र रखना आपकी ज़िम्मेदारी है।"], ["heading", "3. खाता और API कुंजियाँ"], ["body", "आपकी एक्सचेंज API कुंजियाँ एन्क्रिप्टेड रखी जाती हैं और केवल आपकी ओर से ऑर्डर भेजने के लिए उपयोग होती हैं। अपनी कुंजियों में निकासी (withdrawal) की अनुमति बंद रखने की ज़िम्मेदारी आपकी है; ऐप उसे बंद नहीं करता, केवल चालू होने का पता लगाकर चेतावनी देता या अस्वीकार करता है। अपने खाते और API कुंजियों की सुरक्षा की ज़िम्मेदारी आपकी है।"], ["heading", "4. सदस्यता और भुगतान"], ["body", "कुछ सुविधाओं (लाइव बॉट बनाना, एक से अधिक डेमो बॉट, महीने में 5 से अधिक बैकटेस्ट) के लिए सशुल्क सदस्यता चाहिए। सदस्यताएँ Apple App Store से प्रबंधित होती हैं; शुल्क, रद्दीकरण और रिफ़ंड की शर्तें Apple की अपनी नीतियों के अधीन हैं।"], ["heading", "5. दायित्व की सीमा"], ["body", "एक्सचेंज बाधाओं, API त्रुटियों, नेटवर्क विलंब, बाज़ार की अस्थिरता या उपयोगकर्ता की गलती सहित ऐप के उपयोग से होने वाली किसी भी प्रत्यक्ष या अप्रत्यक्ष वित्तीय हानि के लिए ऐप प्रदाता उत्तरदायी नहीं ठहराया जा सकता। ऐप \"जैसा है\" आधार पर दिया जाता है; बिना रुकावट या त्रुटिरहित चलने की गारंटी नहीं है।"], ["heading", "6. निषिद्ध उपयोग"], ["body", "आप ऐप का उपयोग अवैध उद्देश्यों के लिए, किसी और के खाते पर बिना अनुमति ट्रेड करने के लिए, या एक्सचेंज/Apple के नियम तोड़ने वाले तरीके से नहीं कर सकते।"], ["heading", "7. खाता समाप्ति"], ["body", "यदि इन शर्तों का उल्लंघन पाया गया तो आपका खाता निलंबित या बंद किया जा सकता है।"], ["heading", "8. खाता हटाना"], ["body", "आप कभी भी प्रोफ़ाइल > खाता हटाएँ में जाकर अपना खाता हटा सकते हैं। यदि आपका कोई बॉट चल रहा है या Marketplace पर रणनीति प्रकाशित है, तो पहले उसे रोकना/हटाना होगा। खाता हटाने से आपकी Apple सदस्यता रद्द नहीं होती; उसे App Store > सदस्यताएँ में अलग से रद्द करना होगा।"], ["heading", "9. लागू कानून और अधिकार क्षेत्र"], ["body", "इन शर्तों पर तुर्किये गणराज्य का कानून लागू होता है। विवादों में तुर्किये की अदालतें और निष्पादन कार्यालय सक्षम हैं; उपभोक्ता कानून के अधिकार-क्षेत्र नियम और उपभोक्ता मध्यस्थता बोर्डों में आवेदन का आपका अधिकार सुरक्षित है।"], ["heading", "10. परिवर्तन"], ["body", "ये शर्तें समय-समय पर अपडेट हो सकती हैं; महत्वपूर्ण बदलावों की सूचना आपको ऐप में दी जाएगी।"]]}, "id": {"title": "Ketentuan Penggunaan", "items": [["body", "Terakhir diperbarui: 2026"], ["body", "Penyedia layanan: Vedat Koçyiğit (pengembang individu). Kontak: kocyigit.vdt@gmail.com"], ["heading", "1. Deskripsi Layanan"], ["body", "Shark Trader (\"Aplikasi\") adalah layanan perangkat lunak yang memungkinkan pengguna terhubung ke akun bursa mereka sendiri (dengan kunci API) dan membuat bot trading otomatis. Aplikasi berjalan dalam dua mode: Demo (virtual/sandbox, tidak ada uang asli yang bergerak) dan Live (mengirim order sungguhan dengan uang sungguhan). Aplikasi BUKAN pialang, perusahaan manajemen portofolio, penyedia layanan aset kripto, atau penasihat investasi. Aplikasi tidak menyimpan dana pengguna; hanya meneruskan order di akun bursa milik pengguna sendiri sesuai aturan yang dibuat pengguna. Regulasi aset kripto berbeda di tiap negara dan dapat berubah; kamu bertanggung jawab memastikan penggunaan Aplikasi sesuai hukum di tempatmu berada."], ["heading", "2. Peringatan Risiko Investasi"], ["body", "Bertransaksi aset kripto dan aset keuangan lainnya berisiko tinggi; kamu bisa kehilangan seluruh dana yang kamu setorkan. Bot, indikator, hasil backtest, dan strategi contoh di dalam Aplikasi BUKAN NASIHAT INVESTASI. Kinerja masa lalu (termasuk backtest) tidak menjamin hasil di masa depan. Setiap bot yang kamu buat dalam mode Live adalah keputusan dan tanggung jawabmu sendiri."], ["heading", "2.1. Strategi Milikmu Sendiri"], ["body", "Kamu sendiri yang menulis atau memilih skrip Indicator Bot dan pengaturan bot lainnya. Strategi yang kamu tulis bisa keliru, tidak lengkap, atau merugikan; Aplikasi menerima (memvalidasi) skripmu tidak berarti strategi tersebut akan menguntungkan atau aman. Kamu bertanggung jawab penuh atas strategimu dan kerugian yang timbul darinya. Menyalin strategi orang lain dari Marketplace juga merupakan keputusan dan tanggung jawabmu sendiri."], ["heading", "2.2. Risiko Trading Otomatis"], ["body", "Trading otomatis memiliki risiko berikut, dan penyedia Aplikasi tidak bertanggung jawab atas kerugian yang timbul darinya: bot tidak berjalan, atau order stop-loss/take-profit tidak dieksekusi tepat waktu, saat server, jaringan, atau bursa gangguan; data harga yang terlambat, salah, atau hilang; slippage dan eksekusi parsial; limit order yang tidak pernah terisi; batas laju bursa dan order yang ditolak bursa; bursa mengubah API-nya. Hasil backtest didasarkan pada data historis dan mungkin tidak mencerminkan biaya, slippage, dan likuiditas seperti kenyataannya. Menghentikan bot dalam mode Live tidak menutup posisi terbuka di bursa; memantau posisimu adalah tanggung jawabmu."], ["heading", "3. Akun dan Kunci API"], ["body", "Kunci API bursamu disimpan dengan enkripsi dan hanya digunakan untuk mengirim order atas namamu. Kamu bertanggung jawab memastikan izin PENARIKAN (withdrawal) pada kuncimu DINONAKTIFKAN; Aplikasi tidak menonaktifkannya, hanya mendeteksi jika aktif lalu memperingatkan atau menolak. Kamu bertanggung jawab atas keamanan akun dan kunci API-mu."], ["heading", "4. Langganan dan Pembayaran"], ["body", "Beberapa fitur (membuat bot live, lebih dari satu bot demo, lebih dari 5 backtest per bulan) memerlukan langganan berbayar. Langganan dikelola melalui Apple App Store; ketentuan harga, pembatalan, dan pengembalian dana tunduk pada kebijakan Apple sendiri."], ["heading", "5. Pembatasan Tanggung Jawab"], ["body", "Penyedia Aplikasi tidak dapat dimintai pertanggungjawaban atas kerugian finansial langsung maupun tidak langsung yang timbul dari penggunaan Aplikasi, termasuk gangguan bursa, kesalahan API, keterlambatan jaringan, volatilitas pasar, atau kesalahan pengguna. Aplikasi disediakan \"apa adanya\" dan tidak dijamin berjalan tanpa gangguan atau bebas kesalahan."], ["heading", "6. Penggunaan yang Dilarang"], ["body", "Kamu tidak boleh menggunakan Aplikasi untuk tujuan melanggar hukum, untuk bertransaksi di akun orang lain tanpa izin, atau dengan cara yang melanggar aturan bursa/Apple."], ["heading", "7. Penghentian Akun"], ["body", "Jika terbukti kamu melanggar ketentuan ini, akunmu dapat ditangguhkan atau ditutup."], ["heading", "8. Penghapusan Akun"], ["body", "Kamu dapat menghapus akunmu kapan saja di Profil > Hapus Akun. Jika kamu punya bot yang berjalan atau strategi yang dipublikasikan di Marketplace, kamu harus menghentikan atau menghapusnya terlebih dahulu. Menghapus akun tidak membatalkan langganan Apple-mu; batalkan terpisah di App Store > Langganan."], ["heading", "9. Hukum yang Berlaku dan Yurisdiksi"], ["body", "Ketentuan ini tunduk pada hukum Republik Türkiye. Pengadilan dan kantor eksekusi Türkiye berwenang atas sengketa; aturan kewenangan dalam undang-undang perlindungan konsumen dan hakmu mengajukan ke badan arbitrase konsumen tetap berlaku."], ["heading", "10. Perubahan"], ["body", "Ketentuan ini dapat diperbarui dari waktu ke waktu; kamu akan diberi tahu di dalam aplikasi untuk perubahan penting."]]}, "pt-BR": {"title": "Termos de Uso", "items": [["body", "Última atualização: 2026"], ["body", "Prestador do serviço: Vedat Koçyiğit (desenvolvedor individual). Contato: kocyigit.vdt@gmail.com"], ["heading", "1. Descrição do serviço"], ["body", "O Shark Trader (o \"App\") é um serviço de software que permite aos usuários conectar-se às suas próprias contas de corretora (por chave de API) e criar bots de negociação automática. O App funciona em dois modos: Demo (virtual/sandbox, nenhum dinheiro real é movimentado) e Live (envia ordens reais com dinheiro real). O App NÃO é corretora, gestora de carteiras, prestador de serviços de criptoativos nem consultor de investimentos. Ele não custodia os fundos dos usuários; apenas repassa ordens na própria conta de corretora do usuário conforme as regras definidas por ele. A regulamentação de criptoativos varia de país para país e pode mudar; você é responsável por garantir que o uso do App esteja em conformidade com a legislação do local onde você está."], ["heading", "2. Aviso de risco de investimento"], ["body", "Negociar criptoativos e outros ativos financeiros envolve alto risco; você pode perder todo o valor investido. Os bots, indicadores, resultados de backtest e estratégias de exemplo do App NÃO SÃO RECOMENDAÇÃO DE INVESTIMENTO. Desempenho passado (inclusive em backtest) não garante resultados futuros. Cada bot que você criar no modo Live é decisão e responsabilidade suas."], ["heading", "2.1. Suas próprias estratégias"], ["body", "Você escreve ou escolhe os scripts do Indicator Bot e as demais configurações dos bots. Uma estratégia escrita por você pode ser falha, incompleta ou prejudicial; o fato de o App aceitar (validar) seu script não significa que a estratégia será lucrativa ou segura. Você é totalmente responsável por suas estratégias e pelas perdas delas decorrentes. Copiar a estratégia de outra pessoa no Marketplace também é decisão e responsabilidade suas."], ["heading", "2.2. Riscos da negociação automática"], ["body", "A negociação automática traz os seguintes riscos, e o prestador do App não se responsabiliza pelas perdas deles decorrentes: bots que não executam, ou ordens de stop-loss/take-profit que não são executadas a tempo, durante quedas do servidor, da rede ou da corretora; dados de preço atrasados, errados ou ausentes; derrapagem (slippage) e execuções parciais; ordens limite que nunca são executadas; limites de requisições da corretora e ordens rejeitadas por ela; mudanças na API da corretora. Os resultados de backtest baseiam-se em dados históricos e podem não refletir taxas, derrapagem e liquidez como ocorrem na realidade. Parar um bot no modo Live não fecha as posições abertas na corretora; acompanhar suas posições é responsabilidade sua."], ["heading", "3. Conta e chaves de API"], ["body", "Suas chaves de API da corretora são armazenadas com criptografia e usadas apenas para enviar ordens em seu nome. Você é responsável por manter DESATIVADA a permissão de SAQUE nas suas chaves; o App não a desativa, apenas detecta quando está ativada e avisa ou rejeita. Você é responsável pela segurança da sua conta e das suas chaves de API."], ["heading", "4. Assinatura e pagamento"], ["body", "Alguns recursos (criar bots live, mais de um bot demo, mais de 5 backtests por mês) exigem assinatura paga. As assinaturas são gerenciadas pela Apple App Store; preços, cancelamento e reembolso estão sujeitos às políticas da própria Apple."], ["heading", "5. Limitação de responsabilidade"], ["body", "O prestador do App não pode ser responsabilizado por qualquer perda financeira direta ou indireta decorrente do uso do App, incluindo quedas da corretora, erros de API, atrasos de rede, volatilidade do mercado ou erro do usuário. O App é fornecido \"como está\" e não se garante que funcione de forma ininterrupta ou sem erros."], ["heading", "6. Uso proibido"], ["body", "Você não pode usar o App para fins ilegais, para operar na conta de outra pessoa sem permissão ou de forma que viole as regras da corretora ou da Apple."], ["heading", "7. Encerramento da conta"], ["body", "Se for constatado que você violou estes termos, sua conta poderá ser suspensa ou encerrada."], ["heading", "8. Exclusão da conta"], ["body", "Você pode excluir sua conta a qualquer momento em Perfil > Excluir conta. Se tiver um bot em execução ou uma estratégia publicada no Marketplace, precisa antes pará-lo ou removê-la. Excluir a conta não cancela sua assinatura da Apple; você deve cancelá-la separadamente em App Store > Assinaturas."], ["heading", "9. Lei aplicável e foro"], ["body", "Estes termos são regidos pelas leis da República da Türkiye. Os tribunais e órgãos de execução turcos têm competência sobre as disputas; ficam ressalvadas as regras de competência da legislação de defesa do consumidor e seu direito de recorrer às comissões de arbitragem de consumo."], ["heading", "10. Alterações"], ["body", "Estes termos podem ser atualizados de tempos em tempos; você será avisado no app sobre mudanças importantes."]]}, "uk": {"title": "Умови використання", "items": [["body", "Останнє оновлення: 2026"], ["body", "Постачальник послуги: Vedat Koçyiğit (індивідуальний розробник). Контакт: kocyigit.vdt@gmail.com"], ["heading", "1. Опис послуги"], ["body", "Shark Trader («Застосунок») — це програмна послуга, що дозволяє користувачам підключатися до власних біржових акаунтів (через API-ключ) і створювати автоматичних торгових ботів. Застосунок працює у двох режимах: Demo (віртуальний/sandbox, реальні гроші не рухаються) і Live (надсилає реальні ордери за реальні гроші). Застосунок НЕ є брокером, компанією з управління портфелем, постачальником послуг з криптоактивів чи інвестиційним радником. Він не зберігає кошти користувачів; лише передає ордери у власному біржовому акаунті користувача за правилами, які той задає. Регулювання криптоактивів різниться між країнами й може змінюватися; ти відповідаєш за те, щоб користування Застосунком відповідало законам місця, де ти перебуваєш."], ["heading", "2. Попередження про інвестиційний ризик"], ["body", "Торгівля криптоактивами та іншими фінансовими інструментами пов'язана з високим ризиком; ти можеш втратити всю вкладену суму. Боти, індикатори, результати бектестів і приклади стратегій у Застосунку НЕ Є ІНВЕСТИЦІЙНОЮ ПОРАДОЮ. Минулі результати (зокрема бектест) не гарантують майбутніх. Кожен бот, якого ти створюєш у режимі Live, — твоє власне рішення і твоя відповідальність."], ["heading", "2.1. Твої власні стратегії"], ["body", "Скрипти Indicator Bot та інші налаштування ботів ти пишеш або обираєш сам. Написана тобою стратегія може бути помилковою, неповною чи шкідливою; те, що Застосунок прийняв (перевірив) твій скрипт, не означає, що стратегія буде прибутковою чи безпечною. Ти цілком відповідаєш за свої стратегії та збитки від них. Копіювання чужої стратегії з Marketplace — також твоє рішення і твоя відповідальність."], ["heading", "2.2. Ризики автоматичної торгівлі"], ["body", "Автоматична торгівля має такі ризики, і постачальник Застосунку не відповідає за збитки від них: боти не працюють або ордери stop-loss/take-profit не виконуються вчасно під час збоїв сервера, мережі чи біржі; запізнілі, хибні чи неповні цінові дані; прослизання (slippage) і часткове виконання; ліміт-ордери, що ніколи не виконуються; ліміти частоти запитів біржі та ордери, відхилені біржею; зміна біржею свого API. Результати бектесту ґрунтуються на історичних даних і можуть не відображати комісії, прослизання й ліквідність так, як це буває насправді. Зупинка бота в режимі Live не закриває відкриті позиції на біржі; стежити за позиціями — твоя відповідальність."], ["heading", "3. Акаунт і API-ключі"], ["body", "Твої API-ключі біржі зберігаються в зашифрованому вигляді і використовуються лише для надсилання ордерів від твого імені. Ти відповідаєш за те, щоб дозвіл на ВИВЕДЕННЯ коштів (withdrawal) у твоїх ключах був ВИМКНЕНИЙ; Застосунок його не вимикає, а лише виявляє, що він увімкнений, і попереджає або відхиляє. Ти відповідаєш за безпеку свого акаунта та API-ключів."], ["heading", "4. Підписка й оплата"], ["body", "Деякі функції (створення live-ботів, більше одного demo-бота, понад 5 бектестів на місяць) потребують платної підписки. Підписками керує Apple App Store; умови ціни, скасування та повернення коштів підпорядковані власним політикам Apple."], ["heading", "5. Обмеження відповідальності"], ["body", "Постачальника Застосунку не можна притягнути до відповідальності за жодні прямі чи непрямі фінансові збитки від користування Застосунком, зокрема через збої біржі, помилки API, мережеві затримки, волатильність ринку чи помилки користувача. Застосунок надається «як є», і безперебійна чи безпомилкова робота не гарантується."], ["heading", "6. Заборонене використання"], ["body", "Ти не можеш використовувати Застосунок у незаконних цілях, для торгівлі з чужого акаунта без дозволу чи у спосіб, що порушує правила біржі/Apple."], ["heading", "7. Припинення акаунта"], ["body", "Якщо буде виявлено порушення цих умов, твій акаунт може бути призупинено або закрито."], ["heading", "8. Видалення акаунта"], ["body", "Ти можеш видалити акаунт будь-коли в Профіль > Видалити акаунт. Якщо в тебе є запущений бот або стратегія, опублікована в Marketplace, спершу її треба зупинити/прибрати. Видалення акаунта не скасовує твоєї підписки Apple; скасуй її окремо в App Store > Підписки."], ["heading", "9. Застосовне право та юрисдикція"], ["body", "Ці умови регулюються законодавством Турецької Республіки. Спори підсудні судам і виконавчим службам Туреччини; правила підсудності законодавства про захист споживачів і твоє право звертатися до споживчих арбітражних рад зберігаються."], ["heading", "10. Зміни"], ["body", "Ці умови можуть час від часу оновлюватися; про суттєві зміни тебе повідомлять у застосунку."]]}, "vi": {"title": "Điều khoản sử dụng", "items": [["body", "Cập nhật lần cuối: 2026"], ["body", "Nhà cung cấp dịch vụ: Vedat Koçyiğit (nhà phát triển cá nhân). Liên hệ: kocyigit.vdt@gmail.com"], ["heading", "1. Mô tả dịch vụ"], ["body", "Shark Trader (\"Ứng dụng\") là dịch vụ phần mềm cho phép người dùng kết nối với tài khoản sàn của chính mình (bằng khóa API) và tạo bot giao dịch tự động. Ứng dụng chạy ở hai chế độ: Demo (ảo/sandbox, không có tiền thật di chuyển) và Live (gửi lệnh thật bằng tiền thật). Ứng dụng KHÔNG phải là nhà môi giới, công ty quản lý danh mục, nhà cung cấp dịch vụ tài sản mã hóa hay cố vấn đầu tư. Ứng dụng không giữ tiền của người dùng; chỉ chuyển tiếp lệnh trong tài khoản sàn của chính người dùng theo các quy tắc người dùng đặt. Quy định về tài sản mã hóa khác nhau theo từng quốc gia và có thể thay đổi; bạn chịu trách nhiệm đảm bảo việc dùng Ứng dụng phù hợp với pháp luật nơi bạn ở."], ["heading", "2. Cảnh báo rủi ro đầu tư"], ["body", "Giao dịch tài sản mã hóa và các công cụ tài chính khác có rủi ro cao; bạn có thể mất toàn bộ số tiền đã đầu tư. Các bot, chỉ báo, kết quả backtest và chiến lược mẫu trong Ứng dụng KHÔNG PHẢI LỜI KHUYÊN ĐẦU TƯ. Hiệu suất trong quá khứ (kể cả backtest) không đảm bảo kết quả tương lai. Mỗi bot bạn tạo ở chế độ Live là quyết định và trách nhiệm của riêng bạn."], ["heading", "2.1. Chiến lược của chính bạn"], ["body", "Bạn tự viết hoặc chọn script Indicator Bot và các cài đặt bot khác. Chiến lược bạn viết có thể sai, thiếu hoặc gây hại; việc Ứng dụng chấp nhận (xác thực) script của bạn không có nghĩa chiến lược sẽ có lãi hoặc an toàn. Bạn hoàn toàn chịu trách nhiệm về chiến lược của mình và các khoản lỗ phát sinh. Sao chép chiến lược của người khác trên Marketplace cũng là quyết định và trách nhiệm của riêng bạn."], ["heading", "2.2. Rủi ro của giao dịch tự động"], ["body", "Giao dịch tự động đi kèm các rủi ro sau và nhà cung cấp Ứng dụng không chịu trách nhiệm về tổn thất phát sinh: bot không chạy, hoặc lệnh stop-loss/take-profit không thực thi kịp thời, khi máy chủ, mạng hoặc sàn gián đoạn; dữ liệu giá chậm, sai hoặc thiếu; trượt giá (slippage) và khớp một phần; lệnh giới hạn không bao giờ khớp; giới hạn tần suất của sàn và lệnh bị sàn từ chối; sàn thay đổi API. Kết quả backtest dựa trên dữ liệu lịch sử và có thể không phản ánh phí, trượt giá và thanh khoản như thực tế. Dừng bot ở chế độ Live không đóng các vị thế đang mở trên sàn; theo dõi vị thế của bạn là trách nhiệm của bạn."], ["heading", "3. Tài khoản và khóa API"], ["body", "Khóa API sàn của bạn được lưu ở dạng mã hóa và chỉ dùng để gửi lệnh thay bạn. Bạn chịu trách nhiệm giữ quyền RÚT TIỀN (withdrawal) ở trạng thái TẮT trên khóa của mình; Ứng dụng không tắt quyền này, chỉ phát hiện khi nó đang bật rồi cảnh báo hoặc từ chối. Bạn chịu trách nhiệm về an ninh tài khoản và khóa API của mình."], ["heading", "4. Gói đăng ký và thanh toán"], ["body", "Một số tính năng (tạo bot live, nhiều hơn một bot demo, hơn 5 backtest mỗi tháng) yêu cầu gói đăng ký trả phí. Gói đăng ký được quản lý qua Apple App Store; điều khoản giá, hủy và hoàn tiền tuân theo chính sách của Apple."], ["heading", "5. Giới hạn trách nhiệm"], ["body", "Nhà cung cấp Ứng dụng không chịu trách nhiệm về bất kỳ tổn thất tài chính trực tiếp hay gián tiếp nào phát sinh từ việc dùng Ứng dụng, bao gồm sàn gián đoạn, lỗi API, độ trễ mạng, biến động thị trường hoặc lỗi của người dùng. Ứng dụng được cung cấp \"nguyên trạng\" và không đảm bảo chạy liên tục hay không lỗi."], ["heading", "6. Sử dụng bị cấm"], ["body", "Bạn không được dùng Ứng dụng cho mục đích bất hợp pháp, để giao dịch trên tài khoản của người khác khi chưa được phép, hoặc theo cách vi phạm quy định của sàn/Apple."], ["heading", "7. Chấm dứt tài khoản"], ["body", "Nếu phát hiện bạn vi phạm các điều khoản này, tài khoản của bạn có thể bị tạm ngưng hoặc đóng."], ["heading", "8. Xóa tài khoản"], ["body", "Bạn có thể xóa tài khoản bất cứ lúc nào tại Hồ sơ > Xóa tài khoản. Nếu bạn có bot đang chạy hoặc chiến lược đã đăng trên Marketplace, bạn phải dừng hoặc gỡ chúng trước. Xóa tài khoản không hủy gói đăng ký Apple của bạn; hãy hủy riêng tại App Store > Đăng ký."], ["heading", "9. Luật áp dụng và thẩm quyền"], ["body", "Các điều khoản này chịu sự điều chỉnh của pháp luật Cộng hòa Türkiye. Tòa án và cơ quan thi hành án của Türkiye có thẩm quyền giải quyết tranh chấp; các quy tắc thẩm quyền của luật tiêu dùng và quyền của bạn nộp đơn lên hội đồng trọng tài tiêu dùng được bảo lưu."], ["heading", "10. Thay đổi"], ["body", "Các điều khoản này có thể được cập nhật theo thời gian; bạn sẽ được thông báo trong ứng dụng về các thay đổi quan trọng."]]}, "ur": {"title": "استعمال کی شرائط", "items": [["body", "آخری تازہ کاری: 2026"], ["body", "سروس فراہم کنندہ: Vedat Koçyiğit (انفرادی ڈویلپر)۔ رابطہ: kocyigit.vdt@gmail.com"], ["heading", "1. سروس کی تفصیل"], ["body", "Shark Trader (\"ایپ\") ایک سافٹ ویئر سروس ہے جو صارفین کو اپنے ایکسچینج اکاؤنٹس سے (API کلید کے ذریعے) جڑنے اور خودکار ٹریڈنگ بوٹس بنانے دیتی ہے۔ ایپ دو موڈز میں چلتی ہے: Demo (مجازی/سینڈ باکس، اصل رقم حرکت نہیں کرتی) اور Live (اصل رقم سے اصل آرڈر بھیجتی ہے)۔ ایپ کوئی بروکر، پورٹ فولیو مینجمنٹ کمپنی، کرپٹو اثاثہ سروس فراہم کنندہ یا سرمایہ کاری مشیر نہیں ہے۔ یہ صارفین کے فنڈز اپنے پاس نہیں رکھتی؛ صرف صارف کے اپنے ایکسچینج اکاؤنٹ میں اس کے مقرر کردہ اصولوں کے مطابق آرڈر آگے بھیجتی ہے۔ کرپٹو اثاثوں سے متعلق قوانین ہر ملک میں مختلف ہیں اور بدل سکتے ہیں؛ ایپ کا استعمال آپ کے مقام کے قوانین کے مطابق ہو، اس کی ذمہ داری آپ کی ہے۔"], ["heading", "2. سرمایہ کاری کے خطرے کی وارننگ"], ["body", "کرپٹو اثاثوں اور دیگر مالی آلات میں ٹریڈنگ میں زیادہ خطرہ ہے؛ آپ لگائی گئی پوری رقم کھو سکتے ہیں۔ ایپ میں موجود بوٹس، انڈیکیٹرز، بیک ٹیسٹ نتائج اور نمونہ حکمت عملیاں سرمایہ کاری کا مشورہ نہیں ہیں۔ ماضی کی کارکردگی (بشمول بیک ٹیسٹ) مستقبل کے نتائج کی ضمانت نہیں دیتی۔ Live موڈ میں آپ کا بنایا ہوا ہر بوٹ آپ کا اپنا فیصلہ اور آپ کی اپنی ذمہ داری ہے۔"], ["heading", "2.1. آپ کی اپنی حکمت عملیاں"], ["body", "Indicator Bot اسکرپٹس اور بوٹ کی دیگر ترتیبات آپ خود لکھتے یا منتخب کرتے ہیں۔ آپ کی لکھی ہوئی حکمت عملی غلط، ادھوری یا نقصان دہ ہو سکتی ہے؛ ایپ کے آپ کے اسکرپٹ کو قبول (تصدیق) کرنے کا مطلب یہ نہیں کہ حکمت عملی منافع بخش یا محفوظ ہوگی۔ اپنی حکمت عملیوں اور ان سے ہونے والے نقصانات کی پوری ذمہ داری آپ کی ہے۔ Marketplace سے کسی اور کی حکمت عملی نقل کرنا بھی آپ کا اپنا فیصلہ اور ذمہ داری ہے۔"], ["heading", "2.2. خودکار ٹریڈنگ کے خطرات"], ["body", "خودکار ٹریڈنگ میں درج ذیل خطرات ہیں اور ان سے ہونے والے نقصانات کی ذمہ داری ایپ فراہم کنندہ پر نہیں: سرور، نیٹ ورک یا ایکسچینج کی بندش کے دوران بوٹس کا نہ چلنا یا stop-loss/take-profit آرڈرز کا بروقت نہ چلنا؛ تاخیر سے آنے والا، غلط یا نامکمل قیمت کا ڈیٹا؛ سلپیج اور جزوی تکمیل؛ لمٹ آرڈر کا کبھی پورا نہ ہونا؛ ایکسچینج کی شرح کی حدیں اور ایکسچینج کی طرف سے مسترد آرڈرز؛ ایکسچینج کا API بدل دینا۔ بیک ٹیسٹ نتائج تاریخی ڈیٹا پر مبنی ہیں اور فیس، سلپیج اور لیکویڈیٹی کو حقیقت کی طرح ظاہر نہیں کر سکتے۔ Live موڈ میں بوٹ روکنے سے ایکسچینج پر کھلی پوزیشنیں بند نہیں ہوتیں؛ اپنی پوزیشنوں کی نگرانی آپ کی ذمہ داری ہے۔"], ["heading", "3. اکاؤنٹ اور API کلیدیں"], ["body", "آپ کی ایکسچینج API کلیدیں انکرپٹڈ رکھی جاتی ہیں اور صرف آپ کی طرف سے آرڈر بھیجنے کے لیے استعمال ہوتی ہیں۔ اپنی کلیدوں میں رقم نکالنے (withdrawal) کی اجازت بند رکھنے کی ذمہ داری آپ کی ہے؛ ایپ اسے بند نہیں کرتی، صرف اس کے کھلا ہونے کا پتا لگا کر خبردار کرتی یا مسترد کرتی ہے۔ اپنے اکاؤنٹ اور API کلیدوں کی حفاظت کی ذمہ داری آپ کی ہے۔"], ["heading", "4. سبسکرپشن اور ادائیگی"], ["body", "کچھ خصوصیات (لائیو بوٹ بنانا، ایک سے زیادہ ڈیمو بوٹ، ماہانہ 5 سے زیادہ بیک ٹیسٹ) کے لیے ادا شدہ سبسکرپشن درکار ہے۔ سبسکرپشنز Apple App Store کے ذریعے سنبھالی جاتی ہیں؛ قیمت، منسوخی اور رقم واپسی کی شرائط Apple کی اپنی پالیسیوں کے تابع ہیں۔"], ["heading", "5. ذمہ داری کی حد"], ["body", "ایکسچینج کی بندش، API کی خرابیوں، نیٹ ورک کی تاخیر، مارکیٹ کے اتار چڑھاؤ یا صارف کی غلطی سمیت ایپ کے استعمال سے ہونے والے کسی بھی براہ راست یا بالواسطہ مالی نقصان کا ذمہ دار ایپ فراہم کنندہ کو نہیں ٹھہرایا جا سکتا۔ ایپ \"جیسی ہے\" کی بنیاد پر پیش کی جاتی ہے؛ بلا رکاوٹ یا بغیر غلطی چلنے کی ضمانت نہیں ہے۔"], ["heading", "6. ممنوعہ استعمال"], ["body", "آپ ایپ کو غیر قانونی مقاصد کے لیے، کسی اور کے اکاؤنٹ پر اجازت کے بغیر ٹریڈ کرنے کے لیے، یا ایکسچینج/Apple کے قواعد کی خلاف ورزی کرنے والے طریقے سے استعمال نہیں کر سکتے۔"], ["heading", "7. اکاؤنٹ کی بندش"], ["body", "اگر ان شرائط کی خلاف ورزی ثابت ہو تو آپ کا اکاؤنٹ معطل یا بند کیا جا سکتا ہے۔"], ["heading", "8. اکاؤنٹ حذف کرنا"], ["body", "آپ کسی بھی وقت پروفائل > اکاؤنٹ حذف کریں میں جا کر اپنا اکاؤنٹ حذف کر سکتے ہیں۔ اگر آپ کا کوئی بوٹ چل رہا ہے یا Marketplace پر حکمت عملی شائع ہے تو پہلے اسے روکنا/ہٹانا ہوگا۔ اکاؤنٹ حذف کرنے سے آپ کی Apple سبسکرپشن منسوخ نہیں ہوتی؛ اسے App Store > سبسکرپشنز میں الگ سے منسوخ کریں۔"], ["heading", "9. قابل اطلاق قانون اور دائرہ اختیار"], ["body", "ان شرائط پر جمہوریہ ترکیہ کا قانون لاگو ہوتا ہے۔ تنازعات میں ترکیہ کی عدالتیں اور عملدرآمد کے دفاتر مجاز ہیں؛ صارف قانون کے دائرہ اختیار کے قواعد اور صارف ثالثی بورڈز سے رجوع کا آپ کا حق محفوظ ہے۔"], ["heading", "10. تبدیلیاں"], ["body", "یہ شرائط وقتاً فوقتاً اپ ڈیٹ ہو سکتی ہیں؛ اہم تبدیلیوں کی اطلاع آپ کو ایپ میں دی جائے گی۔"]]}, "ru": {"title": "Условия использования", "items": [["body", "Последнее обновление: 2026"], ["body", "Поставщик услуги: Vedat Koçyiğit (индивидуальный разработчик). Контакт: kocyigit.vdt@gmail.com"], ["heading", "1. Описание услуги"], ["body", "Shark Trader («Приложение») — это программная услуга, позволяющая пользователям подключаться к собственным биржевым аккаунтам (через API-ключ) и создавать автоматических торговых ботов. Приложение работает в двух режимах: Demo (виртуальный/sandbox, реальные деньги не движутся) и Live (отправляет реальные ордера на реальные деньги). Приложение НЕ является брокером, компанией по управлению портфелем, поставщиком услуг с криптоактивами или инвестиционным советником. Оно не хранит средства пользователей; лишь передаёт ордера в собственном биржевом аккаунте пользователя по заданным им правилам. Регулирование криптоактивов различается по странам и может меняться; ты сам отвечаешь за то, чтобы использование Приложения соответствовало законам места, где ты находишься."], ["heading", "2. Предупреждение об инвестиционном риске"], ["body", "Торговля криптоактивами и другими финансовыми инструментами сопряжена с высоким риском; ты можешь потерять всю вложенную сумму. Боты, индикаторы, результаты бэктестов и примеры стратегий в Приложении НЕ ЯВЛЯЮТСЯ ИНВЕСТИЦИОННОЙ РЕКОМЕНДАЦИЕЙ. Прошлые результаты (включая бэктест) не гарантируют будущих. Каждый бот, которого ты создаёшь в режиме Live, — твоё собственное решение и твоя ответственность."], ["heading", "2.1. Твои собственные стратегии"], ["body", "Скрипты Indicator Bot и другие настройки ботов ты пишешь или выбираешь сам. Написанная тобой стратегия может быть ошибочной, неполной или вредной; то, что Приложение приняло (проверило) твой скрипт, не означает, что стратегия будет прибыльной или безопасной. Ты полностью отвечаешь за свои стратегии и убытки от них. Копирование чужой стратегии из Marketplace — тоже твоё решение и твоя ответственность."], ["heading", "2.2. Риски автоматической торговли"], ["body", "Автоматическая торговля несёт следующие риски, и поставщик Приложения не отвечает за убытки от них: боты не работают или ордера stop-loss/take-profit не исполняются вовремя при сбоях сервера, сети или биржи; запоздавшие, неверные или неполные ценовые данные; проскальзывание (slippage) и частичное исполнение; лимитные ордера, которые так и не исполняются; лимиты частоты запросов биржи и ордера, отклонённые биржей; изменение биржей своего API. Результаты бэктеста основаны на исторических данных и могут не отражать комиссии, проскальзывание и ликвидность так, как это бывает в реальности. Остановка бота в режиме Live не закрывает открытые позиции на бирже; следить за позициями — твоя ответственность."], ["heading", "3. Аккаунт и API-ключи"], ["body", "Твои API-ключи биржи хранятся в зашифрованном виде и используются только для отправки ордеров от твоего имени. Ты отвечаешь за то, чтобы разрешение на ВЫВОД средств (withdrawal) в твоих ключах было ОТКЛЮЧЕНО; Приложение его не отключает, а лишь обнаруживает, что оно включено, и предупреждает или отклоняет. Ты отвечаешь за безопасность своего аккаунта и API-ключей."], ["heading", "4. Подписка и оплата"], ["body", "Некоторые функции (создание live-ботов, более одного demo-бота, более 5 бэктестов в месяц) требуют платной подписки. Подписками управляет Apple App Store; условия цены, отмены и возврата регулируются собственными политиками Apple."], ["heading", "5. Ограничение ответственности"], ["body", "Поставщик Приложения не несёт ответственности за любые прямые или косвенные финансовые убытки от использования Приложения, включая сбои биржи, ошибки API, сетевые задержки, волатильность рынка или ошибки пользователя. Приложение предоставляется «как есть», бесперебойная или безошибочная работа не гарантируется."], ["heading", "6. Запрещённое использование"], ["body", "Ты не можешь использовать Приложение в незаконных целях, для торговли с чужого аккаунта без разрешения или способом, нарушающим правила биржи/Apple."], ["heading", "7. Прекращение действия аккаунта"], ["body", "Если будет установлено нарушение этих условий, твой аккаунт может быть приостановлен или закрыт."], ["heading", "8. Удаление аккаунта"], ["body", "Ты можешь удалить аккаунт в любой момент в Профиль > Удалить аккаунт. Если у тебя есть работающий бот или стратегия, опубликованная в Marketplace, сначала нужно остановить/убрать её. Удаление аккаунта не отменяет твою подписку Apple; отмени её отдельно в App Store > Подписки."], ["heading", "9. Применимое право и подсудность"], ["body", "Эти условия регулируются законодательством Турецкой Республики. Споры подсудны судам и исполнительным органам Турции; правила подсудности законодательства о защите прав потребителей и твоё право обращаться в потребительские арбитражные советы сохраняются."], ["heading", "10. Изменения"], ["body", "Эти условия могут время от времени обновляться; о существенных изменениях тебя уведомят в приложении."]]}, "ko": {"title": "이용 약관", "items": [["body", "최종 업데이트: 2026"], ["body", "서비스 제공자: Vedat Koçyiğit (개인 개발자). 연락처: kocyigit.vdt@gmail.com"], ["heading", "1. 서비스 설명"], ["body", "Shark Trader(\"앱\")는 사용자가 자신의 거래소 계정에 (API 키로) 연결해 자동 매매 봇을 만들 수 있게 해 주는 소프트웨어 서비스입니다. 앱은 Demo(가상/샌드박스, 실제 돈이 움직이지 않음)와 Live(실제 돈으로 실제 주문 전송) 두 가지 모드로 작동합니다. 앱은 중개업체, 포트폴리오 운용사, 가상자산 서비스 제공자, 투자 자문가가 아닙니다. 사용자의 자금을 보관하지 않으며, 사용자가 정한 규칙에 따라 사용자 본인의 거래소 계정에서 주문을 전달할 뿐입니다. 가상자산 관련 규제는 국가마다 다르며 바뀔 수 있습니다. 앱 사용이 거주 지역의 법령에 맞는지는 사용자 본인의 책임입니다."], ["heading", "2. 투자 위험 경고"], ["body", "가상자산 및 기타 금융상품 거래는 위험이 높으며 투자한 금액 전부를 잃을 수 있습니다. 앱의 봇, 지표, 백테스트 결과, 예시 전략은 투자 조언이 아닙니다. 과거 성과(백테스트 포함)는 미래 결과를 보장하지 않습니다. Live 모드에서 만든 모든 봇은 사용자 본인의 결정이며 책임입니다."], ["heading", "2.1. 사용자의 전략"], ["body", "Indicator Bot 스크립트와 기타 봇 설정은 사용자가 직접 작성하거나 선택합니다. 작성한 전략은 오류가 있거나 불완전하거나 해로울 수 있으며, 앱이 스크립트를 수락(검증)했다고 해서 전략이 수익을 내거나 안전하다는 뜻은 아닙니다. 전략과 그로 인한 손실에 대한 모든 책임은 사용자에게 있습니다. Marketplace에서 다른 사람의 전략을 복사하는 것 역시 사용자 본인의 결정이며 책임입니다."], ["heading", "2.2. 자동 매매의 위험"], ["body", "자동 매매에는 다음 위험이 따르며, 이로 인한 손실에 대해 앱 제공자는 책임지지 않습니다. 서버·네트워크·거래소 장애 중 봇이 작동하지 않거나 손절/익절 주문이 제때 실행되지 않는 경우, 지연되거나 잘못되었거나 누락된 가격 데이터, 슬리피지와 부분 체결, 체결되지 않는 지정가 주문, 거래소의 요청 제한과 거래소가 거부한 주문, 거래소의 API 변경. 백테스트 결과는 과거 데이터에 기반하며 수수료, 슬리피지, 유동성을 실제처럼 반영하지 못할 수 있습니다. Live 모드에서 봇을 중지해도 거래소의 미결제 포지션은 청산되지 않으며, 포지션 확인은 사용자의 책임입니다."], ["heading", "3. 계정과 API 키"], ["body", "거래소 API 키는 암호화되어 저장되며 사용자를 대신해 주문을 보내는 데만 사용됩니다. 키의 출금(withdrawal) 권한을 꺼 두는 것은 사용자의 책임입니다. 앱은 이를 끄지 않으며, 켜져 있는 것을 감지하면 경고하거나 거부할 뿐입니다. 계정과 API 키의 보안은 사용자의 책임입니다."], ["heading", "4. 구독과 결제"], ["body", "일부 기능(라이브 봇 생성, 둘 이상의 데모 봇, 월 5회 초과 백테스트)은 유료 구독이 필요합니다. 구독은 Apple App Store를 통해 관리되며 요금, 취소, 환불 조건은 Apple의 정책을 따릅니다."], ["heading", "5. 책임의 제한"], ["body", "앱 제공자는 거래소 장애, API 오류, 네트워크 지연, 시장 변동성, 사용자 실수를 포함해 앱 사용으로 발생하는 어떠한 직접적·간접적 금전 손실에 대해서도 책임지지 않습니다. 앱은 \"있는 그대로\" 제공되며 중단 없이 또는 오류 없이 작동한다는 보증이 없습니다."], ["heading", "6. 금지된 사용"], ["body", "불법적인 목적, 허락 없이 타인의 계정으로 거래하는 것, 거래소/Apple 규정을 위반하는 방식으로 앱을 사용할 수 없습니다."], ["heading", "7. 계정 해지"], ["body", "이 약관을 위반한 사실이 확인되면 계정이 정지되거나 폐쇄될 수 있습니다."], ["heading", "8. 계정 삭제"], ["body", "프로필 > 계정 삭제에서 언제든지 계정을 삭제할 수 있습니다. 실행 중인 봇이나 Marketplace에 게시한 전략이 있으면 먼저 중지하거나 내려야 합니다. 계정을 삭제해도 Apple 구독은 취소되지 않으므로 App Store > 구독에서 따로 취소해야 합니다."], ["heading", "9. 준거법과 관할"], ["body", "이 약관에는 튀르키예 공화국 법률이 적용됩니다. 분쟁은 튀르키예 법원과 집행기관이 관할하며, 소비자 법령의 관할 규정과 소비자 중재 위원회에 신청할 권리는 유지됩니다."], ["heading", "10. 변경"], ["body", "이 약관은 수시로 업데이트될 수 있으며 중요한 변경은 앱에서 알려 드립니다."]]}, "ja": {"title": "利用規約", "items": [["body", "最終更新: 2026"], ["body", "サービス提供者: Vedat Koçyiğit(個人開発者)。連絡先: kocyigit.vdt@gmail.com"], ["heading", "1. サービスの説明"], ["body", "Shark Trader(「本アプリ」)は、ユーザーが自分の取引所アカウントに(APIキーで)接続し、自動売買ボットを作成できるソフトウェアサービスです。本アプリはDemo(仮想/サンドボックス、実際のお金は動かない)とLive(実際のお金で実際の注文を送信)の2つのモードで動作します。本アプリは、ブローカー、ポートフォリオ運用会社、暗号資産サービス提供者、投資助言者ではありません。ユーザーの資金を預からず、ユーザーが設定したルールに従って、ユーザー自身の取引所アカウントの注文を中継するだけです。暗号資産に関する規制は国ごとに異なり、変更されることがあります。本アプリの利用がお住まいの地域の法令に適合しているかどうかは、ユーザー自身の責任です。"], ["heading", "2. 投資リスクに関する警告"], ["body", "暗号資産その他の金融商品の取引は高いリスクを伴い、投入した金額の全額を失う可能性があります。本アプリ内のボット、指標、バックテスト結果、サンプル戦略は投資助言ではありません。過去の実績(バックテストを含む)は将来の結果を保証しません。Liveモードで作成したすべてのボットは、ユーザー自身の判断と責任によるものです。"], ["heading", "2.1. ご自身の戦略"], ["body", "Indicator Botのスクリプトやその他のボット設定は、ユーザー自身が記述または選択します。記述した戦略には誤り、不備、有害な点があり得ます。本アプリがスクリプトを受け付けた(検証した)ことは、その戦略が利益を生む、または安全であることを意味しません。戦略およびそこから生じる損失についての責任はすべてユーザーにあります。Marketplaceで他人の戦略をコピーすることも、ユーザー自身の判断と責任です。"], ["heading", "2.2. 自動売買のリスク"], ["body", "自動売買には次のリスクがあり、これらから生じる損失について本アプリの提供者は責任を負いません。サーバー、ネットワーク、取引所の障害時にボットが動作しない、またはストップロス/利確注文が適時に実行されないこと、遅延・誤り・欠落のある価格データ、スリッページと部分約定、約定しない指値注文、取引所のレート制限や取引所に拒否された注文、取引所によるAPIの変更。バックテスト結果は過去のデータに基づくもので、手数料、スリッページ、流動性を実際のとおりには反映しない場合があります。Liveモードでボットを停止しても、取引所の建玉は決済されません。ポジションの確認はユーザーの責任です。"], ["heading", "3. アカウントとAPIキー"], ["body", "取引所のAPIキーは暗号化して保存され、ユーザーに代わって注文を送るためだけに使用されます。キーの出金(withdrawal)権限をオフにしておく責任はユーザーにあります。本アプリはこれをオフにせず、オンになっていることを検出した場合に警告または拒否するだけです。アカウントとAPIキーの安全管理はユーザーの責任です。"], ["heading", "4. サブスクリプションと支払い"], ["body", "一部の機能(ライブボットの作成、複数のデモボット、月5回を超えるバックテスト)には有料サブスクリプションが必要です。サブスクリプションはApple App Storeで管理され、料金、解約、返金の条件はAppleのポリシーに従います。"], ["heading", "5. 責任の制限"], ["body", "本アプリの提供者は、取引所の障害、APIエラー、ネットワーク遅延、市場の変動、ユーザーのミスを含め、本アプリの利用から生じる直接的または間接的な金銭的損失について責任を負いません。本アプリは「現状のまま」提供され、中断なく、またはエラーなく動作することは保証されません。"], ["heading", "6. 禁止される利用"], ["body", "違法な目的、他人のアカウントを無断で使った取引、取引所やAppleの規則に違反する方法で本アプリを利用することはできません。"], ["heading", "7. アカウントの終了"], ["body", "本規約への違反が確認された場合、アカウントが停止または閉鎖されることがあります。"], ["heading", "8. アカウントの削除"], ["body", "プロフィール > アカウントを削除 から、いつでもアカウントを削除できます。稼働中のボットやMarketplaceに公開した戦略がある場合は、先に停止または取り下げる必要があります。アカウントを削除してもAppleのサブスクリプションは解約されないため、App Store > サブスクリプション から別途解約してください。"], ["heading", "9. 準拠法と管轄"], ["body", "本規約にはトルコ共和国の法律が適用されます。紛争についてはトルコの裁判所および執行機関が管轄を有し、消費者法令の管轄規定および消費者仲裁委員会に申し立てる権利は留保されます。"], ["heading", "10. 変更"], ["body", "本規約は随時更新されることがあり、重要な変更はアプリ内でお知らせします。"]]}};

 const n=(navigator.language||"en");if(DATA[n])return n;const s=n.split("-")[0];return DATA[s]?s:(s==="pt"?"pt-BR":"en");}

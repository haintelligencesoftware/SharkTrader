<script>
const DATA={"en": {"title": "Shark Trader — Automated crypto trading assistant", "items": [["body", "Write your own trading rules, test them on past prices, try them in demo mode, then run them on your Binance account. Shark Trader runs your bots on our servers, so they keep working when your phone is off."], ["heading", "What you can do"], ["body", "• Indicator Bot: describe a strategy in a simple script (RSI, EMA, MACD, Bollinger, Fibonacci, candle patterns, multi-timeframe and more) and the bot trades it for you.\n• Spot and Futures: long and short, One-Way or Hedge mode, market or limit entries, staged take profit, stop loss and trailing stop.\n• Backtest: run your script on historical prices before risking anything, with the same engine that runs live.\n• Demo mode: practice on Binance Demo Trading, no real money.\n• Stop loss and take profit orders are placed on the exchange where supported.\n• 13 languages."], ["heading", "Plans"], ["body", "Starter, Pro and Elite subscriptions unlock live bots, more demo bots, more backtests and longer scripts. Subscriptions renew automatically until canceled in your Apple ID settings. Demo mode is free."], ["heading", "Important"], ["body", "Trading crypto involves a high risk of loss. Shark Trader is a tool that executes the rules you write; it does not give investment advice and does not guarantee profit. Past results do not predict future results. Only trade with money you can afford to lose. Keep withdrawal permission disabled on your exchange API keys."], ["heading", "Links"], ["body", "Support: support.html · Terms of Use: terms.html · Privacy Policy: privacy.html · Contact: kocyigit.vdt@gmail.com"]]}, "tr": {"title": "Shark Trader — Otomatik kripto işlem asistanı", "items": [["body", "Kendi işlem kurallarını yaz, geçmiş fiyatlarda test et, demo modunda dene, sonra Binance hesabında çalıştır. Shark Trader botlarını sunucularımızda çalıştırır; telefonun kapalıyken de çalışmaya devam ederler."], ["heading", "Neler yapabilirsin"], ["body", "• Indicator Bot: stratejini basit bir script ile anlat (RSI, EMA, MACD, Bollinger, Fibonacci, mum formasyonları, çoklu zaman dilimi ve daha fazlası); bot senin yerine işlem yapsın.\n• Spot ve Futures: long ve short, One-Way ya da Hedge modu, market ya da limit giriş, kademeli kâr alma, zarar durdurma ve izleyen stop.\n• Backtest: riske girmeden önce script'ini geçmiş fiyatlarda çalıştır; canlıdaki motorla aynı motor kullanılır.\n• Demo modu: Binance Demo Trading'de, gerçek para olmadan dene.\n• Desteklenen yerlerde zarar durdur ve kâr al emirleri borsaya konur.\n• 13 dil."], ["heading", "Paketler"], ["body", "Starter, Pro ve Elite abonelikleri canlı botları, daha fazla demo botu, daha fazla backtest ve daha uzun script'leri açar. Abonelikler Apple ID ayarlarından iptal edilene kadar otomatik yenilenir. Demo modu ücretsizdir."], ["heading", "Önemli"], ["body", "Kripto işlemleri yüksek kayıp riski taşır. Shark Trader senin yazdığın kuralları çalıştıran bir araçtır; yatırım tavsiyesi vermez ve kâr garantisi vermez. Geçmiş sonuçlar gelecekteki sonuçları göstermez. Yalnızca kaybetmeyi göze alabileceğin parayla işlem yap. Borsa API anahtarlarında para çekme yetkisini kapalı tut."], ["heading", "Bağlantılar"], ["body", "Destek: support.html · Kullanım Şartları: terms.html · Gizlilik Politikası: privacy.html · İletişim: kocyigit.vdt@gmail.com"]]}};
const sel=document.getElementById("lang");
function pick(){const q=new URLSearchParams(location.search).get("lang");if(q&&DATA[q])return q;
 const n=(navigator.language||"en");if(DATA[n])return n;const s=n.split("-")[0];return DATA[s]?s:"en";}
function render(l){const d=DATA[l];document.documentElement.lang=l;document.documentElement.dir=l==="ur"?"rtl":"ltr";
 document.getElementById("title").textContent=d.title;const c=document.getElementById("content");c.textContent="";
 for(const [k,t] of d.items){const e=document.createElement(k==="heading"?"h2":"p");e.textContent=t;c.appendChild(e);}
 document.title="Shark Trader — "+d.title;}
sel.value=pick();render(sel.value);sel.onchange=()=>render(sel.value);
</script></body></html>

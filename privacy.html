<script>
const DATA={"en": {"title": "Privacy Policy", "items": [["body", "Data controller: Vedat Koçyiğit (individual developer). Contact: kocyigit.vdt@gmail.com. This text serves as a privacy notice under Turkish Personal Data Protection Law No. 6698 (KVKK)."], ["heading", "1. Data Collected"], ["body", "When you create an account, your email address and username are collected. Your password is stored irreversibly (hashed) and is never kept as plain text. Your exchange API keys are stored encrypted; they are decrypted temporarily on the server only to place orders on your behalf. The configuration of the bots you create, their trade history and backtest results are stored linked to your account."], ["heading", "2. Use of Data and Legal Basis"], ["body", "Your data is processed only to provide the App's service (running bots, sending orders to the exchange, verifying subscriptions, support); the legal bases are performance of the contract, compliance with legal obligations and legitimate interest in service security. Your data is not sold or shared with third parties for advertising."], ["heading", "3. Third Parties"], ["body", "Your exchange account is accessed only with the API key you provide, on your behalf; the App does not access your exchange's other data. Payments are processed through the Apple App Store; your payment details (card number, etc.) never reach the App's servers and are handled directly by Apple."], ["heading", "3.1. Transfer Abroad"], ["body", "Your data may be processed on the servers hosting the App and with service providers such as email delivery and Apple, which may be located outside Türkiye. Transfers are made under KVKK Article 9, with the required safeguards and by the means the law permits."], ["heading", "4. Data Security"], ["body", "Your API keys and other sensitive data are protected with industry-standard encryption. Still, no system is completely secure; in the event of a security breach you will be notified within the framework of legal obligations."], ["heading", "5. Retention and Deletion"], ["body", "When you delete your account, your personal data and exchange connections are removed from the system (except transaction records that must be kept by law)."], ["heading", "6. Your Rights (KVKK Article 11)"], ["body", "You have the right to learn whether your personal data is processed, to request information if it has been processed, to learn whether it is used for its purpose, to know the parties it is transferred to, to request correction if it is incomplete or wrong, to request its deletion or destruction, to request that these actions be notified to third parties it was transferred to, to object to a result against you arising from analysis by automated systems, and to claim compensation for damage caused by unlawful processing. You can send your requests to kocyigit.vdt@gmail.com. You can also delete your account and data yourself under Profile > Delete Account."], ["heading", "7. Changes"], ["body", "This policy may be updated from time to time; you will be notified in the app of significant changes."]]}, "tr": {"title": "Gizlilik Politikası", "items": [["body", "Veri Sorumlusu: Vedat Koçyiğit (bireysel geliştirici). İletişim: kocyigit.vdt@gmail.com. Bu metin, 6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK) kapsamında aydınlatma metni niteliğindedir."], ["heading", "1. Toplanan Veriler"], ["body", "Hesap oluştururken e-posta adresiniz ve kullanıcı adınız alınır. Şifreniz geri döndürülemez şekilde (hash) saklanır, düz metin olarak hiçbir zaman tutulmaz. Borsa API anahtarlarınız şifrelenmiş olarak saklanır; şifresi yalnızca sizin adınıza emir göndermek için sunucu tarafında geçici olarak çözülür. Oluşturduğunuz botların yapılandırması, işlem geçmişi ve backtest sonuçları hesabınızla ilişkilendirilerek saklanır."], ["heading", "2. Verilerin Kullanımı ve Hukuki Sebep"], ["body", "Verileriniz yalnızca Uygulama'nın hizmetini sunmak (bot çalıştırma, borsaya emir gönderme, abonelik doğrulama, destek) amacıyla; hukuki sebep olarak sözleşmenin ifası, hukuki yükümlülüklerin yerine getirilmesi ve hizmet güvenliğine ilişkin meşru menfaat kapsamında işlenir. Verileriniz satılmaz veya reklam amacıyla üçüncü taraflarla paylaşılmaz."], ["heading", "3. Üçüncü Taraflar"], ["body", "Borsa hesabınıza yalnızca sizin verdiğiniz API anahtarıyla, sizin adınıza bağlanılır — Uygulama borsanızın diğer verilerine erişmez. Ödemeler Apple App Store üzerinden işlenir; ödeme bilgileriniz (kart numarası vb.) Uygulama sunucularına hiç ulaşmaz, doğrudan Apple tarafından yönetilir."], ["heading", "3.1. Yurt Dışına Aktarım"], ["body", "Verileriniz, Uygulama'nın barındırıldığı sunucularda, e-posta gönderim ve Apple gibi hizmet sağlayıcılarda işlenebilir; bunlar Türkiye dışında bulunabilir. Aktarım KVKK madde 9 uyarınca, gerekli güvencelerle ve mevzuatın izin verdiği yollarla yapılır."], ["heading", "4. Veri Güvenliği"], ["body", "API anahtarlarınız ve diğer hassas veriler endüstri standardı şifreleme ile korunur. Yine de hiçbir sistem yüzde yüz güvenli değildir; bir güvenlik ihlali durumunda yasal yükümlülükler çerçevesinde bilgilendirilirsiniz."], ["heading", "5. Verilerin Saklanması ve Silinmesi"], ["body", "Hesabınızı sildiğinizde kişisel verileriniz ve borsa bağlantılarınız sistemden kaldırılır (yasal saklama zorunluluğu olan işlem kayıtları hariç)."], ["heading", "6. Haklarınız (KVKK madde 11)"], ["body", "Kişisel verilerinizin işlenip işlenmediğini öğrenme, işlenmişse bilgi talep etme, amacına uygun kullanılıp kullanılmadığını öğrenme, aktarıldığı kişileri bilme, eksik veya yanlış işlenmişse düzeltilmesini isteme, silinmesini veya yok edilmesini isteme, bu işlemlerin aktarıldığı üçüncü kişilere bildirilmesini isteme, otomatik sistemlerle analiz sonucu aleyhinize bir sonuç çıkmasına itiraz etme ve kanuna aykırı işleme nedeniyle zararın giderilmesini talep etme haklarına sahipsiniz. Başvurularınızı kocyigit.vdt@gmail.com adresine iletebilirsiniz. Hesabınızı ve verilerinizi Profil > Hesabı Sil bölümünden kendiniz de silebilirsiniz."], ["heading", "7. Değişiklikler"], ["body", "Bu politika zaman zaman güncellenebilir; önemli değişikliklerde uygulama içinden bilgilendirilirsiniz."]]}, "es": {"title": "Política de privacidad", "items": [["body", "Responsable del tratamiento: Vedat Koçyiğit (desarrollador individual). Contacto: kocyigit.vdt@gmail.com. Este texto sirve como aviso de privacidad conforme a la Ley turca de Protección de Datos Personales n.º 6698 (KVKK)."], ["heading", "1. Datos recogidos"], ["body", "Al crear una cuenta se recogen tu correo electrónico y tu nombre de usuario. Tu contraseña se almacena de forma irreversible (hash) y nunca se guarda en texto plano. Tus claves API del exchange se almacenan cifradas; solo se descifran temporalmente en el servidor para enviar órdenes en tu nombre. La configuración de los bots que creas, su historial de operaciones y los resultados de backtest se almacenan vinculados a tu cuenta."], ["heading", "2. Uso de los datos y base jurídica"], ["body", "Tus datos se tratan únicamente para prestar el servicio de la App (ejecutar bots, enviar órdenes al exchange, verificar suscripciones, soporte); las bases jurídicas son la ejecución del contrato, el cumplimiento de obligaciones legales y el interés legítimo en la seguridad del servicio. Tus datos no se venden ni se comparten con terceros con fines publicitarios."], ["heading", "3. Terceros"], ["body", "Tu cuenta de exchange solo se usa con la clave API que proporcionas, en tu nombre; la App no accede a otros datos de tu exchange. Los pagos se procesan a través de la App Store de Apple; tus datos de pago (número de tarjeta, etc.) nunca llegan a los servidores de la App y los gestiona directamente Apple."], ["heading", "3.1. Transferencia al extranjero"], ["body", "Tus datos pueden tratarse en los servidores donde se aloja la App y con proveedores de servicios como el envío de correo electrónico y Apple, que pueden estar fuera de Türkiye. Las transferencias se realizan conforme al artículo 9 de la KVKK, con las garantías necesarias y por las vías que permite la ley."], ["heading", "4. Seguridad de los datos"], ["body", "Tus claves API y demás datos sensibles están protegidos con cifrado estándar de la industria. Aun así, ningún sistema es totalmente seguro; en caso de brecha de seguridad se te informará conforme a las obligaciones legales."], ["heading", "5. Conservación y eliminación"], ["body", "Al eliminar tu cuenta, tus datos personales y conexiones de exchange se eliminan del sistema (salvo los registros de operaciones que la ley obliga a conservar)."], ["heading", "6. Tus derechos (artículo 11 de la KVKK)"], ["body", "Tienes derecho a saber si se tratan tus datos personales, a solicitar información si se han tratado, a saber si se usan conforme a su finalidad, a conocer los terceros a los que se transfieren, a solicitar su corrección si son incompletos o erróneos, a solicitar su supresión o destrucción, a solicitar que estas operaciones se notifiquen a los terceros a los que se transfirieron, a oponerte a un resultado desfavorable derivado de análisis mediante sistemas automatizados y a reclamar la indemnización de los daños causados por un tratamiento ilícito. Puedes enviar tus solicitudes a kocyigit.vdt@gmail.com. También puedes eliminar tú mismo tu cuenta y tus datos en Perfil > Eliminar cuenta."], ["heading", "7. Cambios"], ["body", "Esta política puede actualizarse de vez en cuando; se te informará en la app de los cambios importantes."]]}, "fil": {"title": "Patakaran sa Privacy", "items": [["body", "Data controller: Vedat Koçyiğit (indibidwal na developer). Contact: kocyigit.vdt@gmail.com. Nagsisilbi ang tekstong ito bilang abiso sa privacy alinsunod sa Batas ng Türkiye sa Proteksyon ng Personal na Datos Blg. 6698 (KVKK)."], ["heading", "1. Mga Kinokolektang Datos"], ["body", "Sa paggawa ng account, kinokolekta ang email address at username mo. Nakaimbak nang hindi na mababaligtad (hash) ang password mo at hindi kailanman iniingatan bilang plain text. Nakaimbak nang naka-encrypt ang mga API key mo sa exchange; pansamantala lang itong dine-decrypt sa server para magpadala ng order sa ngalan mo. Nakaimbak na nakaugnay sa account mo ang configuration ng mga bot na ginawa mo, kasaysayan ng trade at resulta ng backtest."], ["heading", "2. Paggamit ng Datos at Legal na Batayan"], ["body", "Pinoproseso lang ang datos mo para ibigay ang serbisyo ng App (pagpapatakbo ng bot, pagpapadala ng order sa exchange, pag-verify ng subscription, suporta); ang mga legal na batayan ay ang pagtupad sa kontrata, pagsunod sa mga legal na obligasyon at lehitimong interes sa seguridad ng serbisyo. Hindi ibinebenta o ibinabahagi ang datos mo sa mga ikatlong partido para sa advertising."], ["heading", "3. Mga Ikatlong Partido"], ["body", "Kumokonekta sa exchange account mo gamit lang ang API key na ibinigay mo, sa ngalan mo; hindi ina-access ng App ang iba mong datos sa exchange. Pinoproseso ang mga bayad sa Apple App Store; hindi kailanman umaabot sa mga server ng App ang detalye ng bayad mo (numero ng card atbp.) at direktang hinahawakan ng Apple."], ["heading", "3.1. Paglilipat sa Ibang Bansa"], ["body", "Maaaring maproseso ang datos mo sa mga server kung saan naka-host ang App at sa mga service provider tulad ng pagpapadala ng email at Apple, na maaaring nasa labas ng Türkiye. Ginagawa ang paglilipat ayon sa Artikulo 9 ng KVKK, may kinakailangang mga pananggalang at sa mga paraang pinapayagan ng batas."], ["heading", "4. Seguridad ng Datos"], ["body", "Protektado ng industry-standard na encryption ang mga API key mo at iba pang sensitibong datos. Gayunman, walang sistemang ganap na ligtas; sa kaso ng paglabag sa seguridad, aabisuhan ka ayon sa mga legal na obligasyon."], ["heading", "5. Pag-iimbak at Pagbura ng Datos"], ["body", "Kapag na-delete mo ang account, aalisin sa sistema ang personal mong datos at mga koneksyon sa exchange (maliban sa mga talaan ng transaksyong dapat itago ayon sa batas)."], ["heading", "6. Ang mga Karapatan Mo (KVKK Artikulo 11)"], ["body", "May karapatan kang malaman kung pinoproseso ang personal mong datos, humingi ng impormasyon kung napoproseso, malaman kung ginagamit ito ayon sa layunin, malaman ang mga pinaglipatan nito, humiling ng pagtutuwid kung kulang o mali, humiling ng pagbura o pagsira nito, humiling na ipaalam ang mga aksyong ito sa mga ikatlong partidong pinaglipatan, tumutol sa resultang laban sa iyo mula sa pagsusuri ng mga automated system, at humingi ng kabayaran sa pinsalang dulot ng labag-sa-batas na pagproseso. Maaari mong ipadala ang mga kahilingan mo sa kocyigit.vdt@gmail.com. Maaari mo ring i-delete mismo ang account at datos mo sa Profile > Burahin ang Account."], ["heading", "7. Mga Pagbabago"], ["body", "Maaaring i-update paminsan-minsan ang patakarang ito; aabisuhan ka sa app tungkol sa mahahalagang pagbabago."]]}, "hi": {"title": "गोपनीयता नीति", "items": [["body", "डेटा नियंत्रक: Vedat Koçyiğit (व्यक्तिगत डेवलपर)। संपर्क: kocyigit.vdt@gmail.com। यह पाठ तुर्किये के व्यक्तिगत डेटा संरक्षण कानून संख्या 6698 (KVKK) के तहत गोपनीयता सूचना का काम करता है।"], ["heading", "1. एकत्र किया गया डेटा"], ["body", "खाता बनाते समय आपका ईमेल पता और उपयोगकर्ता नाम लिया जाता है। आपका पासवर्ड अपरिवर्तनीय रूप (हैश) में रखा जाता है, सादे पाठ में कभी नहीं। आपकी एक्सचेंज API कुंजियाँ एन्क्रिप्टेड रखी जाती हैं; उन्हें केवल आपकी ओर से ऑर्डर भेजने के लिए सर्वर पर अस्थायी रूप से डिक्रिप्ट किया जाता है। आपके बनाए बॉट का विन्यास, ट्रेड इतिहास और बैकटेस्ट परिणाम आपके खाते से जुड़े रूप में रखे जाते हैं।"], ["heading", "2. डेटा का उपयोग और कानूनी आधार"], ["body", "आपका डेटा केवल ऐप की सेवा देने (बॉट चलाना, एक्सचेंज को ऑर्डर भेजना, सदस्यता सत्यापन, सहायता) के लिए प्रोसेस होता है; कानूनी आधार अनुबंध का निष्पादन, कानूनी दायित्वों का पालन और सेवा सुरक्षा में वैध हित हैं। आपका डेटा बेचा नहीं जाता और विज्ञापन के लिए तीसरे पक्षों से साझा नहीं किया जाता।"], ["heading", "3. तीसरे पक्ष"], ["body", "आपके एक्सचेंज खाते से केवल आपकी दी हुई API कुंजी के साथ, आपकी ओर से जुड़ा जाता है; ऐप आपके एक्सचेंज के अन्य डेटा तक नहीं पहुँचता। भुगतान Apple App Store से प्रोसेस होते हैं; आपकी भुगतान जानकारी (कार्ड नंबर आदि) ऐप के सर्वर तक कभी नहीं पहुँचती, सीधे Apple संभालता है।"], ["heading", "3.1. विदेश में स्थानांतरण"], ["body", "आपका डेटा ऐप जिन सर्वरों पर होस्ट है, तथा ईमेल भेजने और Apple जैसे सेवा प्रदाताओं के पास प्रोसेस हो सकता है; ये तुर्किये के बाहर हो सकते हैं। स्थानांतरण KVKK अनुच्छेद 9 के अनुसार, आवश्यक सुरक्षा उपायों के साथ और कानून द्वारा अनुमत तरीकों से किया जाता है।"], ["heading", "4. डेटा सुरक्षा"], ["body", "आपकी API कुंजियाँ और अन्य संवेदनशील डेटा उद्योग-मानक एन्क्रिप्शन से सुरक्षित हैं। फिर भी कोई सिस्टम पूरी तरह सुरक्षित नहीं होता; सुरक्षा उल्लंघन होने पर कानूनी दायित्वों के अनुसार आपको सूचित किया जाएगा।"], ["heading", "5. डेटा का भंडारण और हटाना"], ["body", "खाता हटाने पर आपका व्यक्तिगत डेटा और एक्सचेंज कनेक्शन सिस्टम से हटा दिए जाते हैं (कानूनन रखे जाने वाले लेन-देन रिकॉर्ड को छोड़कर)।"], ["heading", "6. आपके अधिकार (KVKK अनुच्छेद 11)"], ["body", "आपको यह जानने का अधिकार है कि आपका व्यक्तिगत डेटा प्रोसेस होता है या नहीं; प्रोसेस हुआ हो तो जानकारी माँगने का; यह जानने का कि उसका उपयोग उद्देश्य के अनुरूप है या नहीं; यह जानने का कि उसे किसे भेजा गया; अधूरा या गलत हो तो सुधार माँगने का; उसे हटाने या नष्ट करने की माँग का; इन कार्रवाइयों की सूचना उन तीसरे पक्षों को देने की माँग का जिन्हें डेटा भेजा गया; स्वचालित प्रणालियों के विश्लेषण से आपके विरुद्ध आए परिणाम पर आपत्ति का; और कानून-विरुद्ध प्रोसेसिंग से हुए नुकसान की भरपाई माँगने का। आप अपने अनुरोध kocyigit.vdt@gmail.com पर भेज सकते हैं। आप प्रोफ़ाइल > खाता हटाएँ से अपना खाता और डेटा स्वयं भी हटा सकते हैं।"], ["heading", "7. परिवर्तन"], ["body", "यह नीति समय-समय पर अपडेट हो सकती है; महत्वपूर्ण बदलावों की सूचना आपको ऐप में दी जाएगी।"]]}, "id": {"title": "Kebijakan Privasi", "items": [["body", "Pengendali data: Vedat Koçyiğit (pengembang individu). Kontak: kocyigit.vdt@gmail.com. Teks ini berfungsi sebagai pemberitahuan privasi berdasarkan Undang-Undang Perlindungan Data Pribadi Türkiye No. 6698 (KVKK)."], ["heading", "1. Data yang Dikumpulkan"], ["body", "Saat membuat akun, alamat email dan nama penggunamu dikumpulkan. Kata sandimu disimpan secara tidak dapat dibalik (hash) dan tidak pernah disimpan sebagai teks biasa. Kunci API bursamu disimpan dengan enkripsi; hanya didekripsi sementara di server untuk mengirim order atas namamu. Konfigurasi bot yang kamu buat, riwayat transaksi, dan hasil backtest disimpan terkait dengan akunmu."], ["heading", "2. Penggunaan Data dan Dasar Hukum"], ["body", "Datamu hanya diproses untuk menyediakan layanan Aplikasi (menjalankan bot, mengirim order ke bursa, memverifikasi langganan, dukungan); dasar hukumnya adalah pelaksanaan perjanjian, pemenuhan kewajiban hukum, dan kepentingan sah terkait keamanan layanan. Datamu tidak dijual atau dibagikan kepada pihak ketiga untuk tujuan iklan."], ["heading", "3. Pihak Ketiga"], ["body", "Akun bursamu hanya diakses dengan kunci API yang kamu berikan, atas namamu; Aplikasi tidak mengakses data bursamu yang lain. Pembayaran diproses melalui Apple App Store; data pembayaranmu (nomor kartu, dll.) tidak pernah sampai ke server Aplikasi dan dikelola langsung oleh Apple."], ["heading", "3.1. Transfer ke Luar Negeri"], ["body", "Datamu dapat diproses di server tempat Aplikasi di-hosting dan pada penyedia layanan seperti pengiriman email dan Apple, yang mungkin berada di luar Türkiye. Transfer dilakukan berdasarkan Pasal 9 KVKK, dengan pengamanan yang diperlukan dan melalui cara yang diizinkan hukum."], ["heading", "4. Keamanan Data"], ["body", "Kunci API dan data sensitif lainnya dilindungi dengan enkripsi standar industri. Meski begitu, tidak ada sistem yang sepenuhnya aman; jika terjadi pelanggaran keamanan, kamu akan diberi tahu sesuai kewajiban hukum."], ["heading", "5. Penyimpanan dan Penghapusan Data"], ["body", "Saat kamu menghapus akun, data pribadi dan koneksi bursamu dihapus dari sistem (kecuali catatan transaksi yang wajib disimpan menurut hukum)."], ["heading", "6. Hakmu (Pasal 11 KVKK)"], ["body", "Kamu berhak mengetahui apakah data pribadimu diproses, meminta informasi jika telah diproses, mengetahui apakah digunakan sesuai tujuannya, mengetahui pihak yang menerima transfernya, meminta perbaikan jika tidak lengkap atau salah, meminta penghapusan atau pemusnahan, meminta agar tindakan tersebut diberitahukan kepada pihak ketiga penerima transfer, menolak hasil yang merugikanmu dari analisis sistem otomatis, dan menuntut ganti rugi atas kerugian akibat pemrosesan yang melanggar hukum. Kamu dapat mengirim permintaanmu ke kocyigit.vdt@gmail.com. Kamu juga dapat menghapus akun dan datamu sendiri di Profil > Hapus Akun."], ["heading", "7. Perubahan"], ["body", "Kebijakan ini dapat diperbarui dari waktu ke waktu; kamu akan diberi tahu di dalam aplikasi untuk perubahan penting."]]}, "pt-BR": {"title": "Política de Privacidade", "items": [["body", "Controlador de dados: Vedat Koçyiğit (desenvolvedor individual). Contato: kocyigit.vdt@gmail.com. Este texto serve como aviso de privacidade nos termos da Lei turca de Proteção de Dados Pessoais nº 6698 (KVKK)."], ["heading", "1. Dados coletados"], ["body", "Ao criar uma conta, coletamos seu e-mail e seu nome de usuário. Sua senha é armazenada de forma irreversível (hash) e nunca é mantida em texto simples. Suas chaves de API da corretora são armazenadas com criptografia; são descriptografadas temporariamente no servidor apenas para enviar ordens em seu nome. A configuração dos bots que você cria, o histórico de operações e os resultados de backtest são armazenados vinculados à sua conta."], ["heading", "2. Uso dos dados e base legal"], ["body", "Seus dados são tratados apenas para prestar o serviço do App (executar bots, enviar ordens à corretora, verificar assinaturas, suporte); as bases legais são a execução do contrato, o cumprimento de obrigações legais e o legítimo interesse na segurança do serviço. Seus dados não são vendidos nem compartilhados com terceiros para fins de publicidade."], ["heading", "3. Terceiros"], ["body", "Sua conta de corretora é acessada apenas com a chave de API que você fornece, em seu nome; o App não acessa outros dados da sua corretora. Os pagamentos são processados pela Apple App Store; seus dados de pagamento (número do cartão etc.) nunca chegam aos servidores do App e são tratados diretamente pela Apple."], ["heading", "3.1. Transferência para o exterior"], ["body", "Seus dados podem ser tratados nos servidores em que o App está hospedado e em prestadores de serviços como envio de e-mail e Apple, que podem estar fora da Türkiye. As transferências são feitas conforme o artigo 9 da KVKK, com as garantias necessárias e pelos meios que a lei permite."], ["heading", "4. Segurança dos dados"], ["body", "Suas chaves de API e outros dados sensíveis são protegidos por criptografia padrão de mercado. Ainda assim, nenhum sistema é totalmente seguro; em caso de violação de segurança, você será informado dentro das obrigações legais."], ["heading", "5. Retenção e exclusão"], ["body", "Ao excluir sua conta, seus dados pessoais e conexões de corretora são removidos do sistema (exceto registros de operações que a lei exige manter)."], ["heading", "6. Seus direitos (artigo 11 da KVKK)"], ["body", "Você tem o direito de saber se seus dados pessoais são tratados, de solicitar informações caso tenham sido tratados, de saber se são usados de acordo com a finalidade, de conhecer os terceiros para quem são transferidos, de solicitar a correção se estiverem incompletos ou errados, de solicitar sua exclusão ou destruição, de solicitar que essas operações sejam comunicadas aos terceiros para quem foram transferidos, de se opor a um resultado desfavorável decorrente de análise por sistemas automatizados e de pedir reparação por danos causados por tratamento ilícito. Você pode enviar suas solicitações para kocyigit.vdt@gmail.com. Você também pode excluir sua conta e seus dados em Perfil > Excluir conta."], ["heading", "7. Alterações"], ["body", "Esta política pode ser atualizada de tempos em tempos; você será avisado no app sobre mudanças importantes."]]}, "uk": {"title": "Політика конфіденційності", "items": [["body", "Контролер даних: Vedat Koçyiğit (індивідуальний розробник). Контакт: kocyigit.vdt@gmail.com. Цей текст є повідомленням про конфіденційність відповідно до Закону Туреччини про захист персональних даних № 6698 (KVKK)."], ["heading", "1. Які дані збираються"], ["body", "Під час створення акаунта збираються твоя електронна адреса та ім'я користувача. Пароль зберігається у незворотному вигляді (хеш) і ніколи не зберігається відкритим текстом. Твої API-ключі біржі зберігаються в зашифрованому вигляді; їх лише тимчасово розшифровують на сервері, щоб надсилати ордери від твого імені. Конфігурація створених тобою ботів, історія угод і результати бектестів зберігаються прив'язаними до твого акаунта."], ["heading", "2. Використання даних і правова підстава"], ["body", "Твої дані обробляються лише для надання послуги Застосунку (робота ботів, надсилання ордерів на біржу, перевірка підписки, підтримка); правові підстави — виконання договору, виконання юридичних обов'язків і законний інтерес у безпеці послуги. Твої дані не продаються й не передаються третім особам для реклами."], ["heading", "3. Треті сторони"], ["body", "До твого біржового акаунта підключаються лише за наданим тобою API-ключем, від твого імені; Застосунок не отримує доступу до інших даних твоєї біржі. Платежі обробляються через Apple App Store; твої платіжні дані (номер картки тощо) ніколи не потрапляють на сервери Застосунку й обробляються безпосередньо Apple."], ["heading", "3.1. Передача за кордон"], ["body", "Твої дані можуть оброблятися на серверах, де розміщено Застосунок, і в постачальників послуг, як-от надсилання електронної пошти та Apple, які можуть перебувати за межами Туреччини. Передача здійснюється відповідно до статті 9 KVKK, з необхідними гарантіями та у спосіб, дозволений законом."], ["heading", "4. Безпека даних"], ["body", "Твої API-ключі та інші чутливі дані захищено шифруванням галузевого стандарту. Проте жодна система не є цілком безпечною; у разі порушення безпеки тебе повідомлять відповідно до юридичних обов'язків."], ["heading", "5. Зберігання та видалення даних"], ["body", "Після видалення акаунта твої персональні дані та підключення до бірж видаляються із системи (крім записів про операції, які закон вимагає зберігати)."], ["heading", "6. Твої права (стаття 11 KVKK)"], ["body", "Ти маєш право дізнатися, чи обробляються твої персональні дані, запитати інформацію, якщо вони оброблялися, дізнатися, чи використовуються вони за призначенням, знати, кому їх передано, вимагати виправлення, якщо вони неповні чи хибні, вимагати їх видалення або знищення, вимагати повідомити про ці дії третіх осіб, яким дані передано, заперечити проти несприятливого для тебе результату автоматизованого аналізу та вимагати відшкодування шкоди від незаконної обробки. Свої запити можеш надсилати на kocyigit.vdt@gmail.com. Також можеш сам видалити акаунт і дані в Профіль > Видалити акаунт."], ["heading", "7. Зміни"], ["body", "Ця політика може час від часу оновлюватися; про суттєві зміни тебе повідомлять у застосунку."]]}, "vi": {"title": "Chính sách quyền riêng tư", "items": [["body", "Bên kiểm soát dữ liệu: Vedat Koçyiğit (nhà phát triển cá nhân). Liên hệ: kocyigit.vdt@gmail.com. Văn bản này đóng vai trò thông báo quyền riêng tư theo Luật Bảo vệ Dữ liệu Cá nhân Türkiye số 6698 (KVKK)."], ["heading", "1. Dữ liệu được thu thập"], ["body", "Khi tạo tài khoản, địa chỉ email và tên người dùng của bạn được thu thập. Mật khẩu được lưu không thể đảo ngược (băm) và không bao giờ giữ ở dạng văn bản thuần. Khóa API sàn của bạn được lưu ở dạng mã hóa; chỉ được giải mã tạm thời trên máy chủ để gửi lệnh thay bạn. Cấu hình bot bạn tạo, lịch sử giao dịch và kết quả backtest được lưu gắn với tài khoản của bạn."], ["heading", "2. Sử dụng dữ liệu và cơ sở pháp lý"], ["body", "Dữ liệu của bạn chỉ được xử lý để cung cấp dịch vụ của Ứng dụng (chạy bot, gửi lệnh tới sàn, xác minh gói đăng ký, hỗ trợ); cơ sở pháp lý là thực hiện hợp đồng, tuân thủ nghĩa vụ pháp lý và lợi ích hợp pháp về an ninh dịch vụ. Dữ liệu của bạn không bị bán hay chia sẻ cho bên thứ ba vì mục đích quảng cáo."], ["heading", "3. Bên thứ ba"], ["body", "Tài khoản sàn của bạn chỉ được truy cập bằng khóa API bạn cung cấp, thay mặt bạn; Ứng dụng không truy cập dữ liệu khác trên sàn của bạn. Thanh toán được xử lý qua Apple App Store; thông tin thanh toán của bạn (số thẻ, v.v.) không bao giờ tới máy chủ của Ứng dụng mà do Apple trực tiếp xử lý."], ["heading", "3.1. Chuyển dữ liệu ra nước ngoài"], ["body", "Dữ liệu của bạn có thể được xử lý trên các máy chủ lưu trữ Ứng dụng và tại các nhà cung cấp dịch vụ như gửi email và Apple, có thể nằm ngoài Türkiye. Việc chuyển được thực hiện theo Điều 9 KVKK, với các biện pháp bảo đảm cần thiết và theo cách pháp luật cho phép."], ["heading", "4. An ninh dữ liệu"], ["body", "Khóa API và dữ liệu nhạy cảm khác của bạn được bảo vệ bằng mã hóa chuẩn ngành. Tuy vậy, không hệ thống nào an toàn tuyệt đối; nếu xảy ra vi phạm an ninh, bạn sẽ được thông báo theo nghĩa vụ pháp lý."], ["heading", "5. Lưu trữ và xóa dữ liệu"], ["body", "Khi bạn xóa tài khoản, dữ liệu cá nhân và kết nối sàn của bạn bị gỡ khỏi hệ thống (trừ các bản ghi giao dịch pháp luật yêu cầu lưu giữ)."], ["heading", "6. Quyền của bạn (Điều 11 KVKK)"], ["body", "Bạn có quyền biết dữ liệu cá nhân của mình có được xử lý hay không, yêu cầu thông tin nếu đã được xử lý, biết dữ liệu có được dùng đúng mục đích không, biết các bên đã nhận dữ liệu, yêu cầu chỉnh sửa nếu thiếu hoặc sai, yêu cầu xóa hoặc hủy, yêu cầu thông báo các thao tác này cho bên thứ ba đã nhận dữ liệu, phản đối kết quả bất lợi cho bạn phát sinh từ phân tích bằng hệ thống tự động, và yêu cầu bồi thường thiệt hại do xử lý trái pháp luật. Bạn có thể gửi yêu cầu tới kocyigit.vdt@gmail.com. Bạn cũng có thể tự xóa tài khoản và dữ liệu tại Hồ sơ > Xóa tài khoản."], ["heading", "7. Thay đổi"], ["body", "Chính sách này có thể được cập nhật theo thời gian; bạn sẽ được thông báo trong ứng dụng về các thay đổi quan trọng."]]}, "ur": {"title": "رازداری کی پالیسی", "items": [["body", "ڈیٹا کنٹرولر: Vedat Koçyiğit (انفرادی ڈویلپر)۔ رابطہ: kocyigit.vdt@gmail.com۔ یہ متن ترکیہ کے ذاتی ڈیٹا کے تحفظ کے قانون نمبر 6698 (KVKK) کے تحت رازداری کے نوٹس کے طور پر کام کرتا ہے۔"], ["heading", "1. جمع کیا جانے والا ڈیٹا"], ["body", "اکاؤنٹ بناتے وقت آپ کا ای میل ایڈریس اور صارف نام لیا جاتا ہے۔ آپ کا پاس ورڈ ناقابل واپسی صورت (ہیش) میں رکھا جاتا ہے، سادہ متن میں کبھی نہیں۔ آپ کی ایکسچینج API کلیدیں انکرپٹڈ رکھی جاتی ہیں؛ انہیں صرف آپ کی طرف سے آرڈر بھیجنے کے لیے سرور پر عارضی طور پر ڈیکرپٹ کیا جاتا ہے۔ آپ کے بنائے ہوئے بوٹس کی ترتیب، ٹریڈ کی تاریخ اور بیک ٹیسٹ نتائج آپ کے اکاؤنٹ سے منسلک صورت میں رکھے جاتے ہیں۔"], ["heading", "2. ڈیٹا کا استعمال اور قانونی بنیاد"], ["body", "آپ کا ڈیٹا صرف ایپ کی سروس فراہم کرنے (بوٹس چلانا، ایکسچینج کو آرڈر بھیجنا، سبسکرپشن کی تصدیق، معاونت) کے لیے پراسیس ہوتا ہے؛ قانونی بنیادیں معاہدے کی تکمیل، قانونی ذمہ داریوں کی تعمیل اور سروس کی سلامتی میں جائز مفاد ہیں۔ آپ کا ڈیٹا فروخت نہیں کیا جاتا اور اشتہار کے لیے تیسرے فریقوں کے ساتھ شیئر نہیں کیا جاتا۔"], ["heading", "3. تیسرے فریق"], ["body", "آپ کے ایکسچینج اکاؤنٹ سے صرف آپ کی دی ہوئی API کلید کے ساتھ، آپ کی طرف سے جڑا جاتا ہے؛ ایپ آپ کے ایکسچینج کے دیگر ڈیٹا تک رسائی نہیں کرتی۔ ادائیگیاں Apple App Store کے ذریعے پراسیس ہوتی ہیں؛ آپ کی ادائیگی کی معلومات (کارڈ نمبر وغیرہ) ایپ کے سرورز تک کبھی نہیں پہنچتیں، براہ راست Apple سنبھالتا ہے۔"], ["heading", "3.1. بیرون ملک منتقلی"], ["body", "آپ کا ڈیٹا ان سرورز پر جہاں ایپ ہوسٹ ہے، اور ای میل بھیجنے اور Apple جیسے سروس فراہم کنندگان کے پاس پراسیس ہو سکتا ہے؛ یہ ترکیہ سے باہر ہو سکتے ہیں۔ منتقلی KVKK کے آرٹیکل 9 کے مطابق، ضروری تحفظات کے ساتھ اور قانون کی اجازت یافتہ طریقوں سے کی جاتی ہے۔"], ["heading", "4. ڈیٹا کی سلامتی"], ["body", "آپ کی API کلیدیں اور دیگر حساس ڈیٹا صنعتی معیار کی انکرپشن سے محفوظ ہیں۔ پھر بھی کوئی نظام مکمل محفوظ نہیں ہوتا؛ سلامتی کی خلاف ورزی کی صورت میں قانونی ذمہ داریوں کے مطابق آپ کو مطلع کیا جائے گا۔"], ["heading", "5. ڈیٹا کا ذخیرہ اور حذف"], ["body", "اکاؤنٹ حذف کرنے پر آپ کا ذاتی ڈیٹا اور ایکسچینج کنکشن نظام سے ہٹا دیے جاتے ہیں (قانوناً محفوظ رکھے جانے والے لین دین کے ریکارڈ کے علاوہ)۔"], ["heading", "6. آپ کے حقوق (KVKK آرٹیکل 11)"], ["body", "آپ کو یہ جاننے کا حق ہے کہ آپ کا ذاتی ڈیٹا پراسیس ہوتا ہے یا نہیں؛ پراسیس ہوا ہو تو معلومات مانگنے کا؛ یہ جاننے کا کہ اس کا استعمال مقصد کے مطابق ہے یا نہیں؛ یہ جاننے کا کہ اسے کس کو منتقل کیا گیا؛ ادھورا یا غلط ہو تو درستی مانگنے کا؛ اسے حذف یا تلف کرنے کی درخواست کا؛ ان کارروائیوں کی اطلاع ان تیسرے فریقوں کو دینے کی درخواست کا جنہیں ڈیٹا منتقل کیا گیا؛ خودکار نظاموں کے تجزیے سے آپ کے خلاف آنے والے نتیجے پر اعتراض کا؛ اور غیر قانونی پراسیسنگ سے ہونے والے نقصان کے ازالے کا مطالبہ کرنے کا۔ آپ اپنی درخواستیں kocyigit.vdt@gmail.com پر بھیج سکتے ہیں۔ آپ پروفائل > اکاؤنٹ حذف کریں سے اپنا اکاؤنٹ اور ڈیٹا خود بھی حذف کر سکتے ہیں۔"], ["heading", "7. تبدیلیاں"], ["body", "یہ پالیسی وقتاً فوقتاً اپ ڈیٹ ہو سکتی ہے؛ اہم تبدیلیوں کی اطلاع آپ کو ایپ میں دی جائے گی۔"]]}, "ru": {"title": "Политика конфиденциальности", "items": [["body", "Оператор данных: Vedat Koçyiğit (индивидуальный разработчик). Контакт: kocyigit.vdt@gmail.com. Этот текст служит уведомлением о конфиденциальности в соответствии с Законом Турции о защите персональных данных № 6698 (KVKK)."], ["heading", "1. Собираемые данные"], ["body", "При создании аккаунта собираются твой адрес электронной почты и имя пользователя. Пароль хранится в необратимом виде (хеш) и никогда не хранится открытым текстом. Твои API-ключи биржи хранятся в зашифрованном виде; их лишь временно расшифровывают на сервере, чтобы отправлять ордера от твоего имени. Конфигурация созданных тобой ботов, история сделок и результаты бэктестов хранятся привязанными к твоему аккаунту."], ["heading", "2. Использование данных и правовое основание"], ["body", "Твои данные обрабатываются только для предоставления услуги Приложения (работа ботов, отправка ордеров на биржу, проверка подписки, поддержка); правовые основания — исполнение договора, выполнение юридических обязанностей и законный интерес в безопасности услуги. Твои данные не продаются и не передаются третьим лицам для рекламы."], ["heading", "3. Третьи стороны"], ["body", "К твоему биржевому аккаунту подключаются только по выданному тобой API-ключу, от твоего имени; Приложение не получает доступа к другим данным твоей биржи. Платежи обрабатываются через Apple App Store; твои платёжные данные (номер карты и т. п.) никогда не попадают на серверы Приложения и обрабатываются непосредственно Apple."], ["heading", "3.1. Передача за рубеж"], ["body", "Твои данные могут обрабатываться на серверах, где размещено Приложение, и у поставщиков услуг, таких как отправка электронной почты и Apple, которые могут находиться за пределами Турции. Передача осуществляется в соответствии со статьёй 9 KVKK, с необходимыми гарантиями и способами, разрешёнными законом."], ["heading", "4. Безопасность данных"], ["body", "Твои API-ключи и другие чувствительные данные защищены шифрованием отраслевого стандарта. Тем не менее ни одна система не защищена полностью; в случае нарушения безопасности тебя уведомят в соответствии с юридическими обязанностями."], ["heading", "5. Хранение и удаление данных"], ["body", "После удаления аккаунта твои персональные данные и подключения к биржам удаляются из системы (кроме записей об операциях, хранение которых требуется по закону)."], ["heading", "6. Твои права (статья 11 KVKK)"], ["body", "Ты вправе узнать, обрабатываются ли твои персональные данные, запросить информацию, если они обрабатывались, узнать, используются ли они по назначению, знать, кому они переданы, требовать исправления, если они неполны или неверны, требовать их удаления или уничтожения, требовать уведомить об этих действиях третьих лиц, которым данные переданы, возражать против неблагоприятного для тебя результата автоматизированного анализа и требовать возмещения ущерба от незаконной обработки. Свои запросы можешь направлять на kocyigit.vdt@gmail.com. Также ты можешь сам удалить аккаунт и данные в Профиль > Удалить аккаунт."], ["heading", "7. Изменения"], ["body", "Эта политика может время от времени обновляться; о существенных изменениях тебя уведомят в приложении."]]}, "ko": {"title": "개인정보 처리방침", "items": [["body", "개인정보 처리자: Vedat Koçyiğit (개인 개발자). 연락처: kocyigit.vdt@gmail.com. 이 문서는 튀르키예 개인정보 보호법 제6698호(KVKK)에 따른 개인정보 처리 안내문 역할을 합니다."], ["heading", "1. 수집하는 데이터"], ["body", "계정을 만들 때 이메일 주소와 사용자 이름을 수집합니다. 비밀번호는 되돌릴 수 없는 방식(해시)으로 저장되며 평문으로는 절대 보관하지 않습니다. 거래소 API 키는 암호화되어 저장되고, 사용자를 대신해 주문을 보내기 위해 서버에서 일시적으로만 복호화됩니다. 사용자가 만든 봇의 설정, 거래 내역, 백테스트 결과는 계정에 연결되어 저장됩니다."], ["heading", "2. 데이터 이용 및 법적 근거"], ["body", "데이터는 앱 서비스 제공(봇 실행, 거래소로 주문 전송, 구독 확인, 지원)을 위해서만 처리되며, 법적 근거는 계약 이행, 법적 의무 준수, 서비스 보안에 관한 정당한 이익입니다. 데이터는 판매되지 않으며 광고 목적으로 제3자와 공유되지 않습니다."], ["heading", "3. 제3자"], ["body", "거래소 계정에는 사용자가 제공한 API 키로만 사용자를 대신해 접속하며, 앱은 거래소의 다른 데이터에 접근하지 않습니다. 결제는 Apple App Store를 통해 처리되며 결제 정보(카드 번호 등)는 앱 서버에 전혀 도달하지 않고 Apple이 직접 관리합니다."], ["heading", "3.1. 국외 이전"], ["body", "데이터는 앱이 호스팅된 서버와 이메일 발송, Apple 같은 서비스 제공자에서 처리될 수 있으며, 이들은 튀르키예 밖에 있을 수 있습니다. 이전은 KVKK 제9조에 따라 필요한 보호조치와 법이 허용하는 방식으로 이루어집니다."], ["heading", "4. 데이터 보안"], ["body", "API 키와 기타 민감한 데이터는 업계 표준 암호화로 보호됩니다. 그래도 완전히 안전한 시스템은 없으며, 보안 사고가 발생하면 법적 의무에 따라 알려 드립니다."], ["heading", "5. 보관 및 삭제"], ["body", "계정을 삭제하면 개인정보와 거래소 연결이 시스템에서 제거됩니다(법에 따라 보관해야 하는 거래 기록 제외)."], ["heading", "6. 사용자의 권리(KVKK 제11조)"], ["body", "개인정보가 처리되는지 확인하고, 처리되었다면 정보를 요청하고, 목적에 맞게 사용되는지 확인하고, 이전받은 제3자를 알고, 불완전하거나 잘못된 경우 정정을 요청하고, 삭제 또는 파기를 요청하고, 이러한 조치를 이전받은 제3자에게 통지해 달라고 요청하고, 자동화 시스템 분석으로 자신에게 불리한 결과가 나온 경우 이의를 제기하고, 위법한 처리로 인한 손해의 배상을 청구할 권리가 있습니다. 요청은 kocyigit.vdt@gmail.com으로 보내실 수 있습니다. 프로필 > 계정 삭제에서 직접 계정과 데이터를 삭제할 수도 있습니다."], ["heading", "7. 변경"], ["body", "이 정책은 수시로 업데이트될 수 있으며 중요한 변경은 앱에서 알려 드립니다."]]}, "ja": {"title": "プライバシーポリシー", "items": [["body", "データ管理者: Vedat Koçyiğit(個人開発者)。連絡先: kocyigit.vdt@gmail.com。本文は、トルコ個人データ保護法第6698号(KVKK)に基づくプライバシー通知の役割を果たします。"], ["heading", "1. 収集するデータ"], ["body", "アカウント作成時に、メールアドレスとユーザー名を収集します。パスワードは元に戻せない形(ハッシュ)で保存され、平文で保管されることはありません。取引所のAPIキーは暗号化して保存され、ユーザーに代わって注文を送るために、サーバー上で一時的にのみ復号されます。作成したボットの設定、取引履歴、バックテスト結果は、アカウントに紐づけて保存されます。"], ["heading", "2. データの利用と法的根拠"], ["body", "データは、本アプリのサービス提供(ボットの実行、取引所への注文送信、サブスクリプションの確認、サポート)のためにのみ処理されます。法的根拠は、契約の履行、法的義務の遵守、サービスの安全性に関する正当な利益です。データは販売されず、広告目的で第三者と共有されることもありません。"], ["heading", "3. 第三者"], ["body", "取引所アカウントには、ユーザーが提供したAPIキーでのみ、ユーザーに代わって接続します。本アプリは取引所のその他のデータにはアクセスしません。支払いはApple App Store経由で処理され、支払い情報(カード番号など)は本アプリのサーバーには一切届かず、Appleが直接管理します。"], ["heading", "3.1. 国外への移転"], ["body", "データは、本アプリがホストされているサーバーや、メール配信、Appleなどのサービス提供者で処理されることがあり、これらはトルコ国外にある場合があります。移転はKVKK第9条に基づき、必要な保護措置を講じ、法が認める方法で行われます。"], ["heading", "4. データセキュリティ"], ["body", "APIキーやその他の機微なデータは、業界標準の暗号化で保護されています。ただし、完全に安全なシステムはなく、セキュリティ侵害が起きた場合は、法的義務の範囲でお知らせします。"], ["heading", "5. 保管と削除"], ["body", "アカウントを削除すると、個人データと取引所接続はシステムから削除されます(法律で保管が義務付けられている取引記録を除く)。"], ["heading", "6. ユーザーの権利(KVKK第11条)"], ["body", "ユーザーには、個人データが処理されているかどうかを知る権利、処理されている場合に情報を請求する権利、目的に沿って使われているかを知る権利、移転先の第三者を知る権利、不完全または誤りがある場合に訂正を求める権利、削除または破棄を求める権利、これらの措置を移転先の第三者に通知するよう求める権利、自動化システムによる分析の結果、自分に不利な結果が生じた場合に異議を申し立てる権利、違法な処理による損害の賠償を請求する権利があります。請求はkocyigit.vdt@gmail.comまでお送りください。プロフィール > アカウントを削除 から、ご自身でアカウントとデータを削除することもできます。"], ["heading", "7. 変更"], ["body", "本ポリシーは随時更新されることがあり、重要な変更はアプリ内でお知らせします。"]]}};
const sel=document.getElementById("lang");
function pick(){const q=new URLSearchParams(location.search).get("lang");if(q&&DATA[q])return q;
 const n=(navigator.language||"en");if(DATA[n])return n;const s=n.split("-")[0];return DATA[s]?s:(s==="pt"?"pt-BR":"en");}
function render(l){const d=DATA[l];document.documentElement.lang=l;document.documentElement.dir=l==="ur"?"rtl":"ltr";
 document.getElementById("title").textContent=d.title;const c=document.getElementById("content");c.textContent="";
 for(const [k,t] of d.items){const e=document.createElement(k==="heading"?"h2":"p");e.textContent=t;c.appendChild(e);}
 document.title="Shark Trader — "+d.title;}
sel.value=pick();render(sel.value);sel.onchange=()=>render(sel.value);
